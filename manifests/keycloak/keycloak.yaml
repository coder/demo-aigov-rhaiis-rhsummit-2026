# Keycloak (Red Hat Build of Keycloak) instance for the demo realm.
#
# Single-replica, single-Postgres, booth-grade. Production would set
# instances: 3 with HA + Postgres replication, but we're going for
# "comes up clean every time, easy to reset" over "production-grade
# resilience."
#
# Hostname: `keycloak.apps.cluster.rhsummit.coderdemo.io`. The cluster's
# wildcard cert from cert-manager (`*.apps.cluster.rhsummit.coderdemo.io`)
# covers it; we reference the same Route TLS pattern used by Coder.
#
# Database: CNPG-managed Postgres at `keycloak-db-app` Secret (auto-
# generated by the postgres-cluster.yaml manifest in this directory).
# Keycloak operator pulls the connection URI from there.
#
# Admin credentials: the RHBK operator creates an `admin` user on
# first start with a random password stored in the
# `keycloak-initial-admin` Secret in this namespace. Read it post-install:
#   oc get secret keycloak-initial-admin -n keycloak \
#     -o jsonpath='{.data.password}' | base64 -d
# Document the value in 1Password under "RH Summit booth - Keycloak
# admin". Demo users (alice/bob/carol/dave) come from the
# KeycloakRealmImport CR (see realm-demo.yaml), NOT from this CR.
#
# Why no proxy: false / proxy: edge — the OpenShift Route in front of
# the Keycloak Service terminates TLS for us, so Keycloak itself
# serves HTTP on port 8080. Setting `proxy: edge` tells Keycloak to
# trust the X-Forwarded-* headers so its issuer URL renders as HTTPS.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-rw.keycloak.svc
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  hostname:
    hostname: keycloak.apps.cluster.rhsummit.coderdemo.io
  proxy:
    headers: xforwarded
  # No TLS at the Keycloak pod — the OpenShift Route terminates TLS
  # via the cluster's wildcard cert (see route.yaml in this dir).
  # `http.httpEnabled: true` tells the operator to expose plain
  # HTTP on 8080.
  http:
    httpEnabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
