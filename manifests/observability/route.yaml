# OpenShift Route for Grafana. The umbrella coder-observability chart
# (and its nested grafana subchart) deploys the Service as plain
# `grafana` with port name `service`. Earlier comments referenced
# `coder-observability-grafana`/`http-web` — those are the bitnami
# grafana chart's defaults but our umbrella overrides the
# fullnameOverride; verify with `oc get svc -n coder-observability`
# after a chart bump.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  namespace: coder-observability
  annotations:
    haproxy.router.openshift.io/timeout: "60s"
spec:
  host: graf-coder.apps.cluster.rhsummit.coderdemo.io
  to:
    kind: Service
    name: grafana
    weight: 100
  port:
    targetPort: service
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    externalCertificate:
      name: grafana-tls
---
# The router SA needs explicit permission to read externalCertificate
# secrets in namespaces outside openshift-ingress (OCP 4.16+ requirement).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-tls-reader
  namespace: coder-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: coder-observability
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-tls-reader
  namespace: coder-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: coder-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-tls-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
