# OperatorGroup for the group-sync-operator's namespace. The operator
# runs cluster-scoped (it watches GitHub and reconciles
# cluster-scoped Groups), so the OperatorGroup MUST omit
# `spec.targetNamespaces` — that's how OLM signals "AllNamespaces"
# install mode, which the group-sync-operator CSV requires.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: group-sync-operator
  namespace: group-sync-operator
spec: {}
