# Subscription — installs group-sync-operator from the
# community-operators catalog. `installPlanApproval: Automatic`
# means OLM will pick up upgrades from the alpha channel without
# human gating; for the demo's 1-week lifespan that's fine and
# matches every other Subscription in this repo.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: group-sync-operator
  namespace: group-sync-operator
spec:
  channel: alpha
  name: group-sync-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
