# Keycloak demo-users RBAC (3-persona model, see docs/decisions.md §37).
#
# Binds the Keycloak `/admins` group to cluster-admin. This is the
# Keycloak-path equivalent of the GitHub `admin` team binding in
# `cluster-admin-binding.yaml` — demoadm gets cluster-admin whether he
# logs in via GitHub OAuth (admin team membership) or via Keycloak
# (admins group membership).
#
# /developers (alice) and /auditors (bob) are intentionally NOT bound
# to any cluster role. The 3-persona narrative is that platform-level
# access (OCP, Argo, Grafana) belongs to demoadm only; alice and bob
# operate through the app layer (Coder, GitLab).
#
# How group resolution works:
#   The OAuth/cluster CR's `openID.claims.groups: [groups]` mapping
#   surfaces the user's Keycloak `groups` claim as the user's
#   OpenShift identity-time group membership. At authz time, OCP's
#   RBAC evaluator matches `subjects[].name: admins` against that
#   claim directly — no separate `Group` resource needed in
#   `user.openshift.io/v1`.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-admins-cluster-admin
  labels:
    app.kubernetes.io/part-of: identity-pivot
    app.kubernetes.io/component: keycloak-rbac
  annotations:
    # Pin sync order so this binding lands AFTER the OAuth CR change
    # (otherwise the `admins` group reference is meaningless).
    argocd.argoproj.io/sync-wave: "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: admins
