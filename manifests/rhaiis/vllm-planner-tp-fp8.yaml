# vllm-planner-tp-fp8 — FP8 Llama 3.3 70B at 32K context on TP-4.
#
# Lives on the dedicated us-east-1b MachineSet (gpu-l40s-tp-fp8.yaml).
# INT4 production (vllm-planner-tp) keeps running on its us-east-1a
# MachineSet as the booth fallback. Only after FP8 is verified serving
# does chatd's openai-compat provider URL flip to this Service.
#
# Configuration mirrors vllm-planner-tp except:
#   - TP=4 (all 4 GPUs on g6e.12xlarge) — needed for FP8's larger weights
#   - --max-num-seqs 12 — fits the larger KV cache budget
#   - nodeSelector pins to gpu-purpose=tensor-parallel-fp8
#
# Weight split (FP8-dynamic):
#   Llama 70B FP8 ~70 GiB / TP=4 = 17.5 GiB/GPU
#   Free per GPU at 0.95 mem util: 48*0.95 - 17.5 - 5 ≈ 23 GiB
#   Total KV cache: ~92 GiB → ~18 concurrent 32K sequences (cap to 12)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-planner-tp-fp8
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: planner-tp-fp8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: planner-tp-fp8
      annotations:
        # Grafana Agent's pod-discovery scrape config has a strict
        # `keep` rule on prometheus.io/scrape=true (see chart's
        # config.river relabel rules). Without these annotations the
        # vllm:* metrics never reach Prometheus and the vLLM Grafana
        # dashboards show "No data".
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: redhat-pull-secret
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40S
        gpu-purpose: tensor-parallel-fp8
      containers:
        - name: vllm
          image: quay.io/modh/vllm:rhoai-2.20-cuda
          imagePullPolicy: Always
          args:
            - --model
            - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - --tool-call-parser
            - llama3_json
            - --enable-auto-tool-choice
            - --enforce-eager
            - --tensor-parallel-size
            - "4"
            - --gpu-memory-utilization
            - "0.95"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "32768"
            - --max-num-seqs
            - "12"
            - --disable-log-requests
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_PORT
              value: "8000"
            - name: VLLM_USE_V1
              value: "0"
          resources:
            requests:
              cpu: "8"
              memory: "64Gi"
              nvidia.com/gpu: "4"
            limits:
              cpu: "32"
              memory: "128Gi"
              nvidia.com/gpu: "4"
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 300
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 120Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-planner-tp-fp8
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-planner-tp-fp8
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: planner-tp-fp8
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
