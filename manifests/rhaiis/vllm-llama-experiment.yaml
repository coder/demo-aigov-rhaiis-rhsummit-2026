# EXPERIMENTAL: Llama 3.3 70B INT4 in isolation
#
# This is the debug companion to the production vllm-planner (which
# now serves Qwen 2.5 32B Instruct AWQ as the booth-ready fallback —
# see decisions §30). This Deployment lives on a separate L40S node
# (provisioned by manifests/machinesets/gpu-l40s-experiment.yaml,
# label `gpu-purpose: experimental`) so iterating here can't disrupt
# the booth.
#
# It is INTENTIONALLY NOT exposed to chatd — no Service registered
# in the openai-compat provider. To reach it for testing:
#   oc port-forward -n ocp-ai svc/vllm-llama-experiment 8001:8000
#   curl http://localhost:8001/v1/models
#
# Iteration log:
#
# 1. (failed) --disable-frontend-multiprocessing
#    The flag only affects the HTTP API frontend, not the engine_core
#    process. Hang persisted.
#
# 2. (failed-but-informative) VLLM_USE_V1=0 forced V0 engine.
#    Instead of hanging, V0 surfaced the actual error V1 was silently
#    deadlocking on:
#      ValueError: No available memory for the cache blocks.
#      Try increasing `gpu_memory_utilization` when initializing the engine.
#    Root cause confirmed: 70B INT4 weights (35 GiB) + framework
#    overhead (7-8 GiB) at default --gpu-memory-utilization=0.9
#    (=43.2 GiB) leaves ZERO room for KV cache on a 48 GiB L40S.
#    V1's core_client deadlocks IN this step; V0 reports the error
#    and exits cleanly. Same underlying problem, different failure
#    mode.
#
# 3. (current) Two-pronged fix on V0:
#    --gpu-memory-utilization 0.95 (pushes vLLM's budget up to 45.6
#    GiB, recovering 2.4 GiB of headroom that was being wasted on the
#    framework reserve)
#    + --max-model-len 8192 (halves the KV cache need vs 16K, so 70B
#    at 8K context needs ~6-7 GiB cache instead of ~12-15 GiB at 16K).
#    Combined: 45.6 - 35 = 10.6 GiB for KV cache; 8K context fits
#    with 3-4 GiB headroom. Booth use case (coding agent tasks) is
#    almost always under 8K input + 4K output, so 8K total is
#    acceptable.
#
# Flags to try next if (3) doesn't fix it:
#   4. --max-model-len 4096 (further halving — leaves more margin)
#   5. Newer rhoai-cuda image tag (vLLM ≥0.9 may have better KV
#      allocator)
#   6. Switch to RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic — FP8
#      weights are larger than INT4 (~70 GiB ≫ L40S budget), so this
#      is NOT actually viable on L40S. Would need A100 80GB or H100
#      80GB. Documented as "future GPU swap" not "try next."
#
# Backout: just `oc delete -f this-file.yaml`. The experimental
# MachineSet stays put for reuse.
---
# DEPRECATED 2026-05-11.
# Single-GPU Llama 70B debug deployment. Replaced by the TP-2 (2× L40S)
# deployment at vllm-planner-tp on worker-l40s-tp-us-east-1a. Scaled
# to 0; hosting MachineSet (worker-l40s-experiment-us-east-1a) also
# scaled to 0. Kept in git for archival of the V0-engine recipe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama-experiment
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm-experiment
    app.kubernetes.io/component: llama-debug
    app.kubernetes.io/part-of: coder-aigov-demo
    coder.com/lifecycle: deprecated
spec:
  # DEPRECATED — scaled to 0 (TP-2 Llama on vllm-planner-tp is the
  # production path). Bump back to 1 only if reviving the single-GPU
  # config for testing.
  replicas: 0
  strategy:
    type: Recreate
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-experiment
      app.kubernetes.io/component: llama-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-experiment
        app.kubernetes.io/component: llama-debug
    spec:
      imagePullSecrets:
        - name: redhat-pull-secret
      # Pin to the EXPERIMENTAL L40S node (not the production planner
      # one). Both have nvidia.com/gpu.product=NVIDIA-L40S; the extra
      # `gpu-purpose=experimental` label distinguishes them.
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40S
        gpu-purpose: experimental
      containers:
        - name: vllm
          image: quay.io/modh/vllm:rhoai-2.20-cuda
          imagePullPolicy: Always
          args:
            - --model
            - RedHatAI/Llama-3.3-70B-Instruct-quantized.w4a16
            - --tool-call-parser
            - llama3_json
            - --enable-auto-tool-choice
            # Skip cudagraph capture. Saves 10-15 min on cold start.
            - --enforce-eager
            # Push GPU memory budget from default 0.9 → 0.95.
            # L40S 48 GiB * 0.95 = 45.6 GiB for vLLM (vs 43.2 at 0.9).
            # Reclaims 2.4 GiB that's wasted as framework reserve at
            # the default; that's the difference between "no KV cache
            # fits" and "8K KV cache fits comfortably" for 70B INT4.
            - --gpu-memory-utilization
            - "0.95"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # 8K context. 70B at 8K needs ~6-7 GiB KV cache; budget
            # after weights (35 GiB) on 45.6 GiB total = 10.6 GiB.
            # Fits with 3-4 GiB headroom. Bumped back to 16K once
            # we know basic init succeeds.
            - --max-model-len
            - "8192"
            - --tensor-parallel-size
            - "1"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_PORT
              value: "8000"
            # Crank vLLM logging to maximum verbosity — we want to
            # see every step of engine init.
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
            # Force V0 engine. V1 engine's core_client.py has a
            # readiness-handshake deadlock with this specific quant
            # on this image (parent loops "Waiting for 1 core engine
            # proc(s) to start: {0}" forever; child loaded weights
            # but never replies). V0 uses a completely different
            # process model — different code path, different IPC.
            - name: VLLM_USE_V1
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          # 70B INT4 cold start: ~12-15 min download + ~2-3 min load
          # + 0 compile time (--enforce-eager). 40 min runway is the
          # buffer we tuned in decisions §30 attempt.
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 80Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-llama-experiment
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm-experiment
    app.kubernetes.io/component: llama-debug
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm-experiment
    app.kubernetes.io/component: llama-debug
  ports:
    - name: http
      port: 8000
      targetPort: http
