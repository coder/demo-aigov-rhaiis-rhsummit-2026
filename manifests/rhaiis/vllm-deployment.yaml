# Red Hat AI Inference Server (RHAIIS) — planner + executor split
#
# The booth demo runs TWO vLLM endpoints to demonstrate a planner /
# executor agentic split:
#
#   vllm-planner   — Llama 3.3 70B Instruct INT4 on L40S 48 GiB
#                     · "do the planning, decompose tasks, decide which
#                       sub-agents to spawn"
#                     · `--tool-call-parser llama3_json`
#                     · 16K context (tight on L40S 48 GiB after 35 GiB
#                       weights + cudagraph buffers; 32K crashed init)
#
#   vllm-executor  — Qwen 2.5 7B Instruct on A10G 24 GiB
#                     · "run the actual tool calls — execute, read_file,
#                       write_file, edit_files"
#                     · `--tool-call-parser hermes`
#                     · 16K context (plenty on A10G 24 GiB after 14 GiB
#                       weights + buffers)
#
# Why two models / two backends:
#   Coder Agents' 19-tool harness asks the chat model to do (a) high-
#   level reasoning ("which sub-agent should run this", "which template
#   matches the user's intent"), (b) precise tool format adherence, AND
#   (c) low-latency tool execution. A single mid-tier model is mediocre
#   at all three. Splitting the workload by capability tier — big model
#   plans, small model executes — gives the booth a clean "watch the
#   smart model orchestrate, watch the fast model execute" narrative
#   AND aligns to how production AI infra is actually built (router +
#   pool of specialized backends).
#
# Why Llama 3.3 70B for planner (not Qwen3 32B, not bigger Qwen):
#   - Llama 3.3 70B has the strongest documented multi-step reasoning
#     in the 70B-class open-weight tier.
#   - The RedHatAI/ namespace ships a vetted INT4 (W4A16) quant that's
#     vLLM 0.8.4-compatible and fits L40S 48 GiB.
#   - Coder is a Red Hat partner; using a Red-Hat-published quant of a
#     Meta model is the right booth narrative for "RH-supported AI
#     infrastructure end to end."
#   - License caveat: Llama 3.3 Community License (NOT OSI-OSS — has
#     the >700M MAU clause and acceptable-use policy). Acceptable for
#     ~all enterprises; may be a sensitivity for the most license-
#     sensitive PubSec audiences. Backup: Qwen3 32B Instruct AWQ in
#     the same slot — same hardware, same refresh procedure, no
#     license caveat. See docs/decisions.md §27.
#
# Why Qwen 2.5 7B for executor (not Granite 8B, not Hermes 3 8B):
#   - The hermes parser handles Qwen 2.5 Instruct's `<tool_call>` format
#     reliably (we proved Granite 8B couldn't and Qwen 2.5 *Coder* AWQ
#     drifted on the format — Qwen 2.5 Instruct is the one variant that
#     works under tool_choice=auto).
#   - 7B is fast enough that the booth visual ("model executes the
#     tool call you can see in real time") feels snappy.
#   - Hermes 3 8B is the runner-up; swap by changing --model only.
#
# GPU node placement: planner pinned to NVIDIA-L40S, executor pinned
# to NVIDIA-A10G. Both nodes are managed by separate MachineSets:
#   - cluster-pqc4z-worker-us-east-1a       (g5.2xlarge, A10G 24 GiB)
#   - cluster-pqc4z-worker-l40s-us-east-1a  (g6e.2xlarge, L40S 48 GiB)
# Backout: change either Deployment's nodeSelector + model + parser
# back to a known-good config; the MachineSets stay put either way.
#
# Pull-secret expectation: a `redhat-pull-secret` of type
# kubernetes.io/dockerconfigjson exists in this namespace, sourced from
# your Red Hat partner subscription.
---
# ─── PLANNER ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-planner
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: planner
    spec:
      imagePullSecrets:
        - name: redhat-pull-secret
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40S
      containers:
        - name: vllm
          image: quay.io/modh/vllm:rhoai-2.20-cuda
          imagePullPolicy: Always
          args:
            - --model
            - RedHatAI/Llama-3.3-70B-Instruct-quantized.w4a16
            # INT4 GPTQ quant published by RedHatAI on HuggingFace —
            # ~35 GiB weights, vetted on vLLM. Auto-detect handles
            # the format; --quantization not strictly needed but
            # explicit is safer.
            - --tool-call-parser
            - llama3_json
            - --enable-auto-tool-choice
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # 16K context. L40S 48 GiB - 35 GiB weights - 2 GiB
            # cudagraph = ~11 GiB free. 16K KV cache for 70B is
            # ~6-8 GiB. Tight; if init fails with "available KV cache
            # memory" error, drop to 8192. Llama 3.3's native 128K
            # context is far out of reach on this GPU regardless.
            - --max-model-len
            - "16384"
            - --disable-log-requests
            - --tensor-parallel-size
            - "1"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_PORT
              value: "8000"
          resources:
            requests:
              cpu: "2"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          # 70B INT4 download is ~35 GiB; allow 25 min runway.
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 150
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 80Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-planner
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# ─── EXECUTOR ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-executor
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: executor
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: executor
    spec:
      imagePullSecrets:
        - name: redhat-pull-secret
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A10G
      containers:
        - name: vllm
          image: quay.io/modh/vllm:rhoai-2.20-cuda
          imagePullPolicy: Always
          args:
            - --model
            - Qwen/Qwen2.5-7B-Instruct
            - --tool-call-parser
            - hermes
            - --enable-auto-tool-choice
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # 16K context. A10G 24 GiB - 14 GiB weights - 2 GiB
            # cudagraph = ~8 GiB free. 16K KV cache for 7B is ~3-4
            # GiB. Comfortable. Could go to 32K if needed.
            - --max-model-len
            - "16384"
            - --disable-log-requests
            - --tensor-parallel-size
            - "1"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_PORT
              value: "8000"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          # 7B fp16 ≈ 14 GiB download; 15 min runway is safe.
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 30Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-executor
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: executor
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: executor
  ports:
    - name: http
      port: 8000
      targetPort: http
