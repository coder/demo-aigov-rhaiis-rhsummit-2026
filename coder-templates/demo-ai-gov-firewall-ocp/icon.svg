<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
>
  <!-- Shield, filled in violet — reads on both light and dark UI. -->
  <path
    d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
    fill="#7c3aed"
    stroke="#5b21b6"
    stroke-width="0.75"
    stroke-linejoin="round"
  />
  <!-- AI processor / chip inside the shield (white fill for contrast). -->
  <rect
    x="9"
    y="9"
    width="6"
    height="6"
    rx="1"
    fill="#ffffff"
    stroke="#5b21b6"
    stroke-width="0.5"
  />
  <!-- Chip I/O pins on all four sides — traffic being filtered. -->
  <g
    stroke="#ffffff"
    stroke-width="1.25"
    stroke-linecap="round"
  >
    <line x1="10.5" y1="7" x2="10.5" y2="9" />
    <line x1="13.5" y1="7" x2="13.5" y2="9" />
    <line x1="10.5" y1="15" x2="10.5" y2="17" />
    <line x1="13.5" y1="15" x2="13.5" y2="17" />
    <line x1="7" y1="10.5" x2="9" y2="10.5" />
    <line x1="7" y1="13.5" x2="9" y2="13.5" />
    <line x1="15" y1="10.5" x2="17" y2="10.5" />
    <line x1="15" y1="13.5" x2="17" y2="13.5" />
  </g>
  <!-- Small plus/spark in the center, hinting "AI" — violet on white chip. -->
  <g
    stroke="#7c3aed"
    stroke-width="1.25"
    stroke-linecap="round"
  >
    <line x1="12" y1="10.5" x2="12" y2="13.5" />
    <line x1="10.5" y1="12" x2="13.5" y2="12" />
  </g>
</svg>
