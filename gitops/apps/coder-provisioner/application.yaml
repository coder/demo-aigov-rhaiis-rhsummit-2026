# Coder external provisioner daemon.
#
# The Coder server runs with CODER_PROVISIONER_DAEMONS=0 (see
# gitops/apps/coder/application.yaml), so all template builds run in this
# separate Deployment. Splitting the provisioner from the API plane lets
# us scale build capacity independently and isolate Terraform-execution
# blast radius.
#
# Required Secret in the `coder` namespace before pods schedule:
#
#   `coder-provisioner-key` — the daemon's auth key against the Coder API.
#                             Managed as a SealedSecret in
#                             manifests/secrets/coder-provisioner-key.yaml.
#                             See docs/secrets.md (or
#                             docs/sealed-secrets-rollout.md for the
#                             one-shot bootstrap step) for the
#                             `coder provisioner keys create` + kubeseal
#                             workflow.
#
# Sync wave 2 — runs after `coder` (wave 1) so the API is reachable when
# the daemon dials home.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-provisioner
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://helm.coder.com/v2
    chart: coder-provisioner
    targetRevision: 2.33.0-rc.3       # match the Coder server chart version
    helm:
      releaseName: coder-provisioner
      values: |
        coder:
          image:
            repo: ghcr.io/coder/coder
            tag: v2.33.0-rc.3          # MUST match the Coder server image
            pullPolicy: IfNotPresent

          replicaCount: 6     # 2 per AZ across us-east-1{a,b,c} via topology spread below

          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "2112"

          env:
            - name: CODER_URL
              value: "http://coder.coder.svc.cluster.local"
            - name: CODER_PROMETHEUS_ENABLE
              value: "true"
            # readOnlyRootFilesystem=true means /home/coder is read-only.
            # The Coder CLI (which the provisionerd is invoked through)
            # tries to mkdir its XDG config dir on first run. Point HOME
            # at /tmp so XDG_CONFIG_HOME lands on the writable emptyDir
            # below.
            - name: HOME
              value: /tmp

          serviceAccount:
            workspacePerms: true
            enableDeployments: true

          # OpenShift restricted-v2 SCC compliance — same pattern as
          # gitops/apps/coder/application.yaml. The chart hardcodes
          # runAsUser: 1000, which falls outside the `coder` namespace's
          # uid-range and is rejected by admission. Null'ing the UID/GID
          # lets the SCC mutating admission inject valid IDs.
          securityContext:
            runAsNonRoot: true
            runAsUser: null
            runAsGroup: null
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault

          # readOnlyRootFilesystem above means we need a writable mount
          # for the Coder CLI's XDG config dir (which provisionerd
          # touches on startup). HOME=/tmp env above points it here.
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi

          volumeMounts:
            - name: tmp
              mountPath: /tmp
              readOnly: false

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

          # Converged cluster — control-plane nodes carry workloads.
          # Tolerate the master taint so provisioner pods schedule on
          # them (same pattern as the coder chart values).
          tolerations:
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule

          # Spread the 6 provisioners evenly across the 3 OCP node AZs
          # (2 per zone). Same pattern + label selector approach as the
          # main coder chart values. DoNotSchedule on imbalance — better
          # to leave a replica Pending than concentrate build capacity
          # in a single AZ.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: coder-provisioner

          # Soft anti-affinity within an AZ — prefer to spread the 2
          # per-AZ replicas across distinct nodes when possible.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: coder-provisioner
                    topologyKey: kubernetes.io/hostname

        provisionerDaemon:
          keySecretName: coder-provisioner-key
          keySecretKey: key

  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
