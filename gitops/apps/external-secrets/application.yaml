# External Secrets Operator CRs — ClusterSecretStore + ExternalSecrets that
# pull the Keycloak demo-realm credentials from AWS Secrets Manager into the
# cluster. See manifests/external-secrets/ for the resources.
#
# Pre-requisite (NOT managed here): the openshift-external-secrets-operator
# Subscription (gitops/operator/external-secrets-subscription.yaml), applied at
# cluster-bootstrap time. Its CRDs must exist before Argo can create these CRs.
#
# Sync-wave "0" — ahead of keycloak (wave 1) so keycloak-realm-secrets exists
# before the realm-import render Job runs.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/coder/demo-aigov-rhaiis-rhsummit-2026.git
    targetRevision: chore/coder-2.37.6-upgrade
    path: manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
