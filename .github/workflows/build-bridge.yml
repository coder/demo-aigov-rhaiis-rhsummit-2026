name: Build + push bridge image

# GitLab→Coder bridge service. Multi-stage Go build → distroless
# runtime, pushed to GHCR. Triggered on any change under
# services/bridge/ or this workflow file.
#
# Tag scheme matches build-images.yml (`latest`, semver-ish, sha).
# Bridge has no upstream version coupling so we tag with the date
# of the build (YYYY.MM.DD) as the "moving" version and the git sha
# as the immutable pin.

on:
  push:
    branches: [main]
    paths:
      - "services/bridge/**"
      - ".github/workflows/build-bridge.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/coder/demo-aigov-rhaiis-rhsummit-2026
  IMAGE_NAME: bridge

jobs:
  build:
    name: Build + push bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build date
        id: date
        run: echo "build_date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push bridge
        uses: docker/build-push-action@v6
        with:
          context: services/bridge
          file: services/bridge/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.build_date }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.build_date }}-${{ github.sha }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max

      - name: Summary
        run: |
          {
            echo "## bridge image pushed"
            echo ""
            echo "- \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`"
            echo "- \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.build_date }}\`"
            echo "- \`${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.build_date }}-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
