# External Secrets Operator (ESO) — Red Hat build.
#
# Applied OUTSIDE Argo CD as part of the cluster-bootstrap step (same pattern
# as the other operator subscriptions in gitops/operator/). The operator must
# be present BEFORE Argo can create the ClusterSecretStore / ExternalSecret /
# ExternalSecretsConfig CRs in the `external-secrets` Argo app.
#
# AllNamespaces install mode (the only mode this operator supports). The
# operator installs into `external-secrets-operator`; the actual external-
# secrets controller is deployed into `external-secrets` once the
# ExternalSecretsConfig/cluster CR is created (see manifests/external-secrets/).
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-operator
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: external-secrets-operator
  namespace: external-secrets-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-external-secrets-operator
  namespace: external-secrets-operator
spec:
  channel: stable-v1
  name: openshift-external-secrets-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
