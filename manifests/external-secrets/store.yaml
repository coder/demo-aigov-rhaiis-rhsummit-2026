# External Secrets Operator — controller config + AWS Secrets Manager wiring.
#
# Pulls the Keycloak demo-realm credentials (generated by Terraform in
# terraform/keycloak-secrets.tf and stored in AWS Secrets Manager as the JSON
# secret `rhsummit/keycloak/demo-realm`) into the cluster as regular Secrets.
# AWS auth is IRSA: the `eso-aws-sm` ServiceAccount assumes the IAM role
# `<cluster>-external-secrets` through the cluster's STS/OIDC provider.
#
# The operator subscription itself lives in gitops/operator/ (bootstrap).
---
# 1. Deploy the external-secrets controller (into the `external-secrets` ns).
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  name: cluster
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
spec: {}
---
# 2. ServiceAccount the AWS provider authenticates as (IRSA). The role ARN is
# the Terraform output `external_secrets_role_arn`
# (arn:aws:iam::342934376218:role/demo/cluster-external-secrets); same
# hardcoded-ARN convention as the coder-server / cert-manager IRSA SAs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws-sm
  namespace: external-secrets
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::342934376218:role/demo/cluster-external-secrets
---
# 3. Let the external-secrets controller mint a projected token for eso-aws-sm
# (required by the AWS provider's jwt.serviceAccountRef auth). Scoped to the
# one SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-aws-sm-token-creator
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["eso-aws-sm"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-aws-sm-token-creator
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-aws-sm-token-creator
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
# 4. The RH ESO operator ships a deny-all-egress NetworkPolicy baseline and
# only allows the controller egress to the API server + DNS. This additive
# policy lets the main controller reach AWS STS + Secrets Manager over HTTPS
# (without it: "AssumeRoleWithWebIdentity ... exceeded maximum number of
# attempts"). Egress to the VPC CIDR is excluded (AWS APIs are public).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eso-allow-aws-egress
  namespace: external-secrets
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
# 5. ClusterSecretStore → AWS Secrets Manager (us-east-1) via IRSA. No `role`
# field: the SA annotation supplies the role for AssumeRoleWithWebIdentity
# (setting both triggers STS role-chaining, which fails).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws-sm
            namespace: external-secrets
