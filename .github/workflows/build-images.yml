name: Build + push workspace images

# Two image lineages live under coder-templates/:
#
#  1. Per-template images at coder-templates/<template>/images/Dockerfile.
#     The original openshift-ai-gov template ships its own image this way.
#
#  2. Shared UBI9 images at coder-templates/images/<image>/Dockerfile:
#       - ubi9-base-workspace : UBI 9.7 base + dev tooling + dotfiles deps
#       - ubi9-node-workspace : FROM ubi9-base-workspace, adds Node 22 LTS
#
#     The 4 -ocp templates (ai-dev-ocp, agents-dev-ocp,
#     demo-ai-gov-firewall-ocp, demo-ai-gov-no-firewall-ocp) all FROM
#     ubi9-node-workspace.
#
# Tag scheme for shared images: every successful build pushes three tags:
#   - <name>:<UBI9_VERSION>            (e.g. 9.7, moves to latest minor build)
#   - <name>:<UBI9_VERSION>-<git-sha>  (immutable, pinable)
#   - <name>:latest                    (alias)

on:
  push:
    branches: [main]
    paths:
      - "coder-templates/**/Dockerfile"
      - "coder-templates/**/images/**"
      - "coder-templates/images/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "What to build: shared, openshift-ai-gov, or all"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - shared
          - openshift-ai-gov

permissions:
  contents: read
  packages: write           # required to push to GHCR

env:
  IMAGE_REGISTRY: ghcr.io/coder/demo-aigov-rhaiis-rhsummit-2026
  UBI9_VERSION: "9.7"

jobs:
  # Shared images: ubi9-base-workspace, then ubi9-node-workspace FROM it.
  # Sequential within a single job — the second build needs the first
  # tag pushed and resolvable at FROM-time.
  build-shared:
    name: Shared UBI9 images
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'shared' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push ubi9-base-workspace
        uses: docker/build-push-action@v6
        with:
          context: coder-templates/images/ubi9-base-workspace
          file: coder-templates/images/ubi9-base-workspace/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:latest
            ${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:${{ env.UBI9_VERSION }}
            ${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:${{ env.UBI9_VERSION }}-${{ github.sha }}
          cache-from: type=gha,scope=ubi9-base-workspace
          cache-to: type=gha,scope=ubi9-base-workspace,mode=max

      - name: Build + push ubi9-node-workspace (FROM ubi9-base-workspace)
        uses: docker/build-push-action@v6
        with:
          context: coder-templates/images/ubi9-node-workspace
          file: coder-templates/images/ubi9-node-workspace/Dockerfile
          platforms: linux/amd64
          push: true
          # Pin node-workspace's FROM to the just-pushed sha so we always
          # layer on a known-good base, not a moving :latest.
          build-args: |
            WORKSPACE_BASE=${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:${{ env.UBI9_VERSION }}-${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:latest
            ${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:${{ env.UBI9_VERSION }}
            ${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:${{ env.UBI9_VERSION }}-${{ github.sha }}
          cache-from: type=gha,scope=ubi9-node-workspace
          cache-to: type=gha,scope=ubi9-node-workspace,mode=max

      - name: Summary
        run: |
          {
            echo "## Shared images pushed (UBI ${{ env.UBI9_VERSION }})"
            echo ""
            echo "- \`${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:latest\` (also \`:${{ env.UBI9_VERSION }}\`, \`:${{ env.UBI9_VERSION }}-${{ github.sha }}\`)"
            echo "- \`${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:latest\` (also \`:${{ env.UBI9_VERSION }}\`, \`:${{ env.UBI9_VERSION }}-${{ github.sha }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Per-template images. Currently just openshift-ai-gov; matrix is
  # extensible — add an entry per template that ships its own
  # images/Dockerfile.
  build-template:
    name: Per-template image (${{ matrix.template }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'openshift-ai-gov' }}
    strategy:
      fail-fast: false
      matrix:
        template: [openshift-ai-gov]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: coder-templates/${{ matrix.template }}/images
          file: coder-templates/${{ matrix.template }}/images/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.template }}-base:latest
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.template }}-base:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.template }}
          cache-to: type=gha,scope=${{ matrix.template }},mode=max

      - name: Summary
        run: |
          {
            echo "## Pushed image"
            echo ""
            echo "- \`${{ env.IMAGE_REGISTRY }}/${{ matrix.template }}-base:latest\`"
            echo "- \`${{ env.IMAGE_REGISTRY }}/${{ matrix.template }}-base:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
