name: Build + push workspace images

# Shared UBI9 images at coder-templates/images/<image>/Dockerfile:
#   - ubi9-base-workspace  : UBI 9.7 base + dev tooling + dotfiles deps
#   - ubi9-node-workspace  : FROM ubi9-base-workspace, adds Node 22 LTS
#   - agents-config-tools  : Tiny UBI9-minimal + aws + jq + curl image
#                            consumed by the `coder-agents-config`
#                            Argo CD Job (gitops/apps/coder-agents-config/).
#
# The 2 -ocp templates (ai-dev-ocp, agents-dev-ocp) both FROM
# ubi9-node-workspace.
#
# Tag scheme: every successful build pushes three tags per image:
#   - <name>:<UBI9_VERSION>            (e.g. 9.7, moves to latest minor build)
#   - <name>:<UBI9_VERSION>-<git-sha>  (immutable, pinable)
#   - <name>:latest                    (alias)

on:
  push:
    branches: [main]
    paths:
      - "coder-templates/images/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write           # required to push to GHCR

env:
  IMAGE_REGISTRY: ghcr.io/coder/demo-aigov-rhaiis-rhsummit-2026
  UBI9_VERSION: "9.7"

jobs:
  # Shared images: ubi9-base-workspace, then ubi9-node-workspace FROM it.
  # Sequential within a single job — the second build needs the first
  # tag pushed and resolvable at FROM-time.
  build-shared:
    name: Shared UBI9 images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push ubi9-base-workspace
        uses: docker/build-push-action@v6
        with:
          context: coder-templates/images/ubi9-base-workspace
          file: coder-templates/images/ubi9-base-workspace/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:latest
            ${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:${{ env.UBI9_VERSION }}
            ${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:${{ env.UBI9_VERSION }}-${{ github.sha }}
          cache-from: type=gha,scope=ubi9-base-workspace
          cache-to: type=gha,scope=ubi9-base-workspace,mode=max

      - name: Build + push ubi9-node-workspace (FROM ubi9-base-workspace)
        uses: docker/build-push-action@v6
        with:
          context: coder-templates/images/ubi9-node-workspace
          file: coder-templates/images/ubi9-node-workspace/Dockerfile
          platforms: linux/amd64
          push: true
          # Pin node-workspace's FROM to the just-pushed sha so we always
          # layer on a known-good base, not a moving :latest.
          build-args: |
            WORKSPACE_BASE=${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:${{ env.UBI9_VERSION }}-${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:latest
            ${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:${{ env.UBI9_VERSION }}
            ${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:${{ env.UBI9_VERSION }}-${{ github.sha }}
          cache-from: type=gha,scope=ubi9-node-workspace
          cache-to: type=gha,scope=ubi9-node-workspace,mode=max

      - name: Build + push agents-config-tools (UBI9-minimal + aws + jq + curl)
        uses: docker/build-push-action@v6
        with:
          context: coder-templates/images/agents-config-tools
          file: coder-templates/images/agents-config-tools/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/agents-config-tools:latest
            ${{ env.IMAGE_REGISTRY }}/agents-config-tools:${{ env.UBI9_VERSION }}
            ${{ env.IMAGE_REGISTRY }}/agents-config-tools:${{ env.UBI9_VERSION }}-${{ github.sha }}
          cache-from: type=gha,scope=agents-config-tools
          cache-to: type=gha,scope=agents-config-tools,mode=max

      - name: Summary
        run: |
          {
            echo "## Shared images pushed (UBI ${{ env.UBI9_VERSION }})"
            echo ""
            echo "- \`${{ env.IMAGE_REGISTRY }}/ubi9-base-workspace:latest\` (also \`:${{ env.UBI9_VERSION }}\`, \`:${{ env.UBI9_VERSION }}-${{ github.sha }}\`)"
            echo "- \`${{ env.IMAGE_REGISTRY }}/ubi9-node-workspace:latest\` (also \`:${{ env.UBI9_VERSION }}\`, \`:${{ env.UBI9_VERSION }}-${{ github.sha }}\`)"
            echo "- \`${{ env.IMAGE_REGISTRY }}/agents-config-tools:latest\` (also \`:${{ env.UBI9_VERSION }}\`, \`:${{ env.UBI9_VERSION }}-${{ github.sha }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
