# Argo CD Application — GitLab→Coder bridge service.
#
# Plain-directory source (no Helm/kustomize) — same pattern as
# coder-agents-config and cluster-config. Manifests sync wave 5
# (after Coder server + admin token are in place).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bridge
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/coder/demo-aigov-rhaiis-rhsummit-2026.git
    targetRevision: main
    path: manifests/bridge
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
