# Coder runs as UID 1000 (hardcoded in the upstream image). OpenShift's
# restricted-v2 SCC only allows the namespace's allocated UID range.
# Grant anyuid so the Coder pods can run as their expected UID.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-server-anyuid
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: coder-server
    namespace: coder
