name: Push templates to Coder

# Pushes Coder workspace templates to the cluster's Coder server via
# `coder templates push`. Authenticates with a long-lived API token
# stored as the CODER_SESSION_TOKEN secret (see
# CODER_MAX_ADMIN_TOKEN_LIFETIME=8760h in
# gitops/apps/coder/application.yaml).
#
# Templates currently pushed:
#  - ai-dev-ocp     — UBI9 ubi9-node-workspace base + Claude/Codex/Gemini/Kiro CLIs
#  - agents-dev-ocp — UBI9 + Coder Agents (beta as of v2.33.1)
#
# Both -ocp templates declare the same two variables (namespace and
# image_registry) so the push step doesn't need any per-template
# branching.

on:
  push:
    branches: [main]
    paths:
      - "coder-templates/**"
      - ".github/workflows/push-templates.yml"
  workflow_dispatch:
    inputs:
      template:
        description: "Template to push, or 'all' for every template"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ai-dev-ocp
          - agents-dev-ocp

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io/coder/demo-aigov-rhaiis-rhsummit-2026
  WORKSPACE_NAMESPACE: coder-workspaces
  CODER_VERSION: 2.33.1

jobs:
  push:
    name: coder templates push (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # On push: matrix expands to the full template list (push events
      # have no `inputs.*` so the first clause picks `all`-equivalent).
      # On workflow_dispatch with "all": same.
      # On workflow_dispatch with a specific template: 1-element matrix.
      # `env.X` can't be referenced inside `strategy.matrix` per GH docs,
      # so the JSON array is inlined.
      matrix:
        template: ${{ fromJSON((github.event_name == 'push' || inputs.template == 'all') && '["ai-dev-ocp","agents-dev-ocp"]' || format('["{0}"]', inputs.template)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coder CLI
        run: |
          curl -L https://coder.com/install.sh | sh -s -- --version "${CODER_VERSION}"
          coder --version

      - name: coder login
        env:
          CODER_URL: ${{ secrets.CODER_URL }}
          CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
        run: |
          coder login "$CODER_URL" --token "$CODER_SESSION_TOKEN"
          coder users show me

      - name: coder templates push
        run: |
          set -euo pipefail
          cd "coder-templates/${{ matrix.template }}"

          coder templates push "${{ matrix.template }}" \
            --directory . \
            --variable "namespace=${WORKSPACE_NAMESPACE}" \
            --variable "image_registry=${IMAGE_REGISTRY}" \
            --yes \
            --message "GH Actions push from ${{ github.sha }}"

          # Apply template metadata (icon, display name) post-push.
          # The chart image doesn't have jq, but we already have it
          # available here on the GH runner.
          if [ -f metadata.json ]; then
            ICON=$(jq -r '.icon // empty' metadata.json)
            DISPLAY=$(jq -r '.display_name // empty' metadata.json)
            EDIT_ARGS=()
            [ -n "$ICON" ] && EDIT_ARGS+=( --icon "$ICON" )
            [ -n "$DISPLAY" ] && EDIT_ARGS+=( --display-name "$DISPLAY" )
            if [ ${#EDIT_ARGS[@]} -gt 0 ]; then
              coder templates edit "${{ matrix.template }}" "${EDIT_ARGS[@]}" --yes
            fi
          fi

      - name: Summary
        run: |
          {
            echo "## Pushed template"
            echo ""
            echo "- \`${{ matrix.template }}\` → ${{ secrets.CODER_URL }}/templates"
            echo "- Source commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
