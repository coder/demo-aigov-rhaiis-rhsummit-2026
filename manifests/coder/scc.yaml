# Coder runs as UID 1000 and sets seccomp annotations. OpenShift's
# restricted-v2 SCC rejects both. Grant privileged for the booth demo
# (production would use a custom SCC with just the needed capabilities).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-server-privileged
  labels:
    app.kubernetes.io/name: coder
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: coder-server
    namespace: coder
