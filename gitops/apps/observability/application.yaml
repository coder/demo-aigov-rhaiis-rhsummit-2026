# Coder Observability stack — Grafana + Prometheus + Loki + Coder dashboards.
#
# Helm chart from helm.coder.com/observability — purpose-built for Coder
# (control plane metrics, AI Bridge dashboards, Agent Boundaries dashboard).
# Same chart pattern zambruhni-refs/k3s-infra uses; values heavily adapted
# for OCP. Detailed translation log:
#
# OpenShift restricted-v2 SCC compliance — every subchart's hardcoded UID
# violates the namespace's openshift.io/sa.scc.uid-range, so each block's
# securityContext gets `runAsUser/runAsGroup/fsGroup: null` to let
# admission inject namespace-valid IDs. Same pattern documented in
# decisions.md §2 / §19. Subchart overrides:
#   - grafana.securityContext (chart default 472)
#   - prometheus.server.securityContext (chart default 65534)
#   - prometheus.alertmanager.podSecurityContext (chart default 65534)
#   - prometheus.kube-state-metrics.securityContext (chart default 65534)
#   - loki.loki.podSecurityContext (chart default 10001)
#   - loki.gateway.podSecurityContext (chart default 101)
#
# Disabled subcharts:
#   - sqlExporter.enabled: false — image is on Docker Hub only
#     (`burningalchemist/sql_exporter`); fresh-cluster pulls hit the
#     anonymous rate limit. Coder's primary metrics come from Prom
#     scraping Coder pods directly via prometheus.io/scrape; we lose
#     advanced Postgres-specific SQL metrics until we mirror the image.
#   - global.postgres.exporter.enabled: false — chart wants a
#     `secret-postgres` Secret with PGUSER/PGPASSWORD env keys; CNPG's
#     auto-generated `coder-app` Secret uses different keys. Wiring a
#     translation Job is follow-up work.
#   - prometheus.prometheus-node-exporter.enabled: false — OCP ships
#     its own node-exporter as part of the cluster-monitoring stack;
#     enabling the chart's would collide on port 9100.
#   - pyroscope/tempo — disabled by chart default; we don't profile
#     workloads at the booth.
#
# GitHub OAuth into Grafana (decision #21 admin-team mapping):
#   - envFromSecret: grafana-github-oauth (sealed manifest at
#     manifests/secrets/grafana-github-oauth.yaml; keys
#     GF_AUTH_GITHUB_CLIENT_ID + GF_AUTH_GITHUB_CLIENT_SECRET).
#   - allowed_organizations: demo-rhsummit-users (decision #20's gate).
#   - role_attribute_path maps the `admin` GitHub team to Grafana's
#     Admin role; everyone else lands as Viewer. Same team slug the
#     OpenShift IdP uses (decision #21), so admins get cluster-admin
#     AND Grafana admin from one team membership change.
#   - skip_org_role_sync: true — we want the attribute_path evaluated
#     on every login, not cached on first sign-in.
#
# Multi-source Argo App: chart from helm.coder.com + manifests
# (Route + Certificate + dashboard ConfigMaps) from this repo. Both apply
# to the `coder-observability` namespace.
#
# Sync wave 3 — runs after Coder (wave 1) and RHAIIS (wave 2).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-observability
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://helm.coder.com/observability
      chart: coder-observability
      targetRevision: "*"
      helm:
        releaseName: coder-observability
        values: |
          global:
            coder:
              controlPlaneNamespace: coder
              externalProvisionersNamespace: coder
              workspacesSelector: 'namespace=`coder-workspaces`'

            postgres:
              hostname: coder-rw.coder.svc.cluster.local
              port: 5432
              database: coder
              username: coder
              # `secret-postgres` is sealed at
              # manifests/secrets/secret-postgres.yaml — key
              # PGPASSWORD, sourced from the CNPG-generated
              # `coder-app` Secret in the `coder` namespace. The
              # chart wires this into the exporter Deployment so
              # `pg_up` (and ~50 other postgres metrics) get
              # published, which the Coder Status dashboard's
              # "Postgres" panel reads. Without this the panel
              # shows DOWN.
              mountSecret: "secret-postgres"
              exporter:
                enabled: true

            dashboards:
              enabled: true
              refresh: "30s"
              timerange: "12h"

            alerts:
              enabled: true

          # Coder-specific SQL exporter — disabled (DH rate limit).
          # See header.
          sqlExporter:
            enabled: false

          grafana:
            enabled: true
            persistence:
              enabled: true
              # `statefulset` renders storage as a volumeClaimTemplate
              # under the StatefulSet (PVC named storage-grafana-0).
              # Default (`pvc`) renders a *standalone* `grafana` PVC
              # plus a Deployment — which collides with the chart's
              # StatefulSet path and leaves the standalone PVC stuck
              # WaitForFirstConsumer indefinitely, hanging every
              # subsequent Argo sync.
              type: statefulset
              size: 5Gi
              # storageClass omitted → uses OCP default (gp3-csi on AWS IPI)

            # OpenShift restricted-v2 SCC compliance.
            # The chart's init-chown-data init container references
            # `.Values.securityContext.runAsUser` directly in its
            # chown command, so we can't use the null-then-inject
            # trick (it would render `chown :` and break the
            # statefulset YAML). Pin to a UID inside the
            # coder-observability namespace's
            # openshift.io/sa.scc.uid-range (1000800000/10000); SCC
            # admission accepts an explicit in-range UID.
            #
            # initChownData is also explicitly disabled below — OCP's
            # CSI driver chgrps the PV at mount time using the SCC's
            # fsGroup, so manual chown isn't needed.
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000800000
              runAsGroup: 1000800000
              fsGroup: 1000800000
              seccompProfile:
                type: RuntimeDefault

            initChownData:
              enabled: false

            # GitHub OAuth client ID / secret as env vars
            # (GF_AUTH_GITHUB_CLIENT_ID / _CLIENT_SECRET) — sealed
            # manifest at manifests/secrets/grafana-github-oauth.yaml.
            envFromSecret: grafana-github-oauth

            # Multiple env-from-secret sources:
            #   - secret-postgres: PGPASSWORD for postgres-exporter datasource
            #   - keycloak-grafana-oidc-secret: client_secret for the
            #     Keycloak generic_oauth provider (key `client_secret`
            #     exposed as $GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET).
            envFromSecrets:
              - name: secret-postgres
                optional: false
              - name: keycloak-grafana-oidc-secret
                optional: false

            grafana.ini:
              server:
                root_url: https://graf-coder.apps.cluster.rhsummit.coderdemo.io
              auth:
                disable_login_form: true
                disable_signout_menu: false
              auth.basic:
                enabled: false
              auth.anonymous:
                enabled: false
              auth.github:
                enabled: true
                allow_sign_up: true
                auto_login: false
                scopes: user:email,read:org
                auth_url: https://github.com/login/oauth/authorize
                token_url: https://github.com/login/oauth/access_token
                api_url: https://api.github.com/user
                allowed_organizations: demo-rhsummit-users
                # Admin-team members get Grafana Admin; everyone else
                # gets Viewer. Format `@<org>/<team-slug>` is what
                # Grafana 10.x's GitHub backend returns in the
                # `groups` claim.
                role_attribute_path: "contains(groups[*], '@demo-rhsummit-users/admin') && 'Admin' || 'Viewer'"
                skip_org_role_sync: true

              # ── Keycloak OIDC (demo personas, added 2026-05-10) ──
              # Second auth provider alongside auth.github. Grafana
              # supports up to one generic_oauth block + the
              # vendor-specific ones (github, google, etc.) — they
              # can coexist on the login page as separate buttons.
              # CLIENT_SECRET comes from the env var
              # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET injected via the
              # keycloak-grafana-oidc-secret SealedSecret.
              auth.generic_oauth:
                enabled: true
                name: Keycloak (demo users)
                allow_sign_up: true
                auto_login: false
                client_id: grafana
                # client_secret comes from env (see envFromSecrets above)
                scopes: openid profile email groups
                auth_url: https://keycloak.apps.cluster.rhsummit.coderdemo.io/realms/demo/protocol/openid-connect/auth
                token_url: https://keycloak.apps.cluster.rhsummit.coderdemo.io/realms/demo/protocol/openid-connect/token
                api_url: https://keycloak.apps.cluster.rhsummit.coderdemo.io/realms/demo/protocol/openid-connect/userinfo
                # Map the Keycloak `admins` group → Grafana Admin role.
                # Members of /developers (and no other admin tier) → Viewer.
                # Same logic as the GitHub path; Grafana applies the role
                # from whichever IdP the user signed in with.
                role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
                skip_org_role_sync: true
                # Use preferred_username as Grafana's login attribute
                # (matches what Coder uses too — consistent identity
                # across the two consumers of the same Keycloak realm).
                login_attribute_path: preferred_username
                # The realm import emits the `groups` claim into the
                # ID/access tokens via the group-membership protocol
                # mapper; Grafana reads it from there.
                groups_attribute_path: groups

            # Infinity plugin — needed by the AI Bridge dashboard's
            # litellm-pricing-data datasource (k3s pattern, copied).
            plugins:
              - yesoreyeram-infinity-datasource

            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
                # The umbrella `coder-observability` chart ships its
                # OWN dashboards provisioning file
                # (`templates/configmap-grafana-dashboards.yaml` →
                # `sidecar.yaml`, provider name `sidecar`, folder
                # `Other`) pointing at `/tmp/dashboards`. By default
                # the grafana subchart ALSO auto-generates a SECOND
                # provisioning file (`sc-dashboardproviders.yaml`)
                # for the same path. Two files = two provider
                # instances = every UID inserted twice = Grafana
                # disables writes for both providers, and NO
                # dashboards (Coder, AI Bridge, agent-boundaries,
                # all of Loki) actually land in the database.
                #
                # `SCProvider: false` skips the chart's
                # auto-generated provisioning file. The kiwigrid
                # sidecar CONTAINER still runs and copies dashboard
                # ConfigMaps into `/tmp/dashboards`; the umbrella's
                # `sidecar.yaml` is the single provider that scans
                # that directory.
                SCProvider: false
              datasources:
                enabled: true
                label: grafana_datasource
                labelValue: "1"

          prometheus:
            enabled: true
            server:
              persistentVolume:
                enabled: true
                size: 20Gi
                # storageClass: gp3-csi (cluster default)
              retention: "7d"     # booth window — k3s ref keeps 60d
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi
              # Restricted-v2 SCC compliance.
              securityContext:
                runAsNonRoot: true
                runAsUser: null
                runAsGroup: null
                fsGroup: null
                seccompProfile:
                  type: RuntimeDefault

            # OCP ships its own node-exporter — disable the chart's.
            prometheus-node-exporter:
              enabled: false

            # Restricted-v2 SCC compliance for alertmanager.
            # The alertmanager subchart's values.schema.json STRICTLY
            # types runAsUser/runAsGroup as integer (no null), so we
            # can't use the null+admission-injection trick the other
            # subcharts allow. Pin to a UID in the
            # coder-observability namespace's
            # openshift.io/sa.scc.uid-range (1000800000/10000). The
            # SCC mutating admission accepts an explicit UID inside
            # the range. The chart has BOTH a podSecurityContext AND a
            # container-level securityContext (chart default
            # runAsUser: 65534 for the latter) — both need the
            # in-range value.
            alertmanager:
              podSecurityContext:
                runAsNonRoot: true
                runAsUser: 1000800000
                runAsGroup: 1000800000
                fsGroup: 1000800000
                seccompProfile:
                  type: RuntimeDefault
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000800000
                runAsGroup: 1000800000

            # kube-state-metrics has the same schema constraint.
            kube-state-metrics:
              securityContext:
                enabled: true
                runAsNonRoot: true
                runAsUser: 1000800000
                runAsGroup: 1000800000
                fsGroup: 1000800000
                seccompProfile:
                  type: RuntimeDefault

          loki:
            enabled: true
            persistence:
              enabled: true
              size: 20Gi
            # The loki subchart hardcodes `kube-dns.kube-system.svc`
            # as the DNS resolver in its nginx-gateway config.
            # OpenShift's CoreDNS lives at
            # `dns-default.openshift-dns`, so without these overrides
            # the loki-gateway pod fails to start with
            # `[emerg] host not found in resolver "kube-dns..."`.
            global:
              dnsService: "dns-default"
              dnsNamespace: "openshift-dns"

            # Pull memcached from Google's Docker Hub mirror — the
            # default `docker.io/library/memcached:1.6.23-alpine`
            # hits DH's anonymous rate limit on a fresh-cluster sync
            # (memcached-exporter has the same problem; we disable
            # it altogether below since it has no published mirror).
            memcached:
              image:
                repository: mirror.gcr.io/library/memcached
                tag: 1.6.23-alpine
            memcachedExporter:
              enabled: false

            # The umbrella chart's `loki:` block enables the bundled
            # minio subchart as the S3 backend (loki-storage SS).
            # minio's chart hardcodes runAsUser: 1000 / fsGroup: 1000
            # (also schema-strict integer). Pin to the namespace's
            # uid-range. Also trim its 16Gi memory request — way more
            # than a demo with a single bucket needs and would block
            # scheduling on a constrained 3-node converged cluster.
            minio:
              securityContext:
                enabled: true
                runAsUser: 1000800000
                runAsGroup: 1000800000
                fsGroup: 1000800000
                fsGroupChangePolicy: OnRootMismatch
              resources:
                requests:
                  memory: 1Gi
                  cpu: 100m
                limits:
                  memory: 2Gi
                  cpu: 500m
            # The loki SUBCHART has its own `loki:` block for the
            # Loki app's pod-level securityContext (chart default
            # 10001). Path: loki.loki.podSecurityContext.
            loki:
              podSecurityContext:
                runAsNonRoot: true
                runAsUser: null
                runAsGroup: null
                fsGroup: null
                seccompProfile:
                  type: RuntimeDefault
            # Loki's nginx gateway subchart defaults to UID 101.
            gateway:
              podSecurityContext:
                runAsNonRoot: true
                runAsUser: null
                runAsGroup: null
                fsGroup: null
                seccompProfile:
                  type: RuntimeDefault

    - repoURL: https://github.com/coder/demo-aigov-rhaiis-rhsummit-2026.git
      targetRevision: main
      path: manifests/observability

  destination:
    server: https://kubernetes.default.svc
    namespace: coder-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
