# ExternalSecrets — materialize the Keycloak demo-realm credentials from AWS
# Secrets Manager (rhsummit/keycloak/demo-realm) into the namespaces that need
# them. One source of truth (AWS SM) for every consumer; no secrets in git.
#
# refreshInterval 1h: ESO re-reads SM hourly, so a Terraform-driven rotation
# propagates automatically. Rotating a value in SM therefore flows to all
# consumers within the refresh window.
---
# Realm bundle — consumed by the keycloak-realm-import render Job (all 7 keys:
# 3 persona passwords + 4 OIDC client secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-realm-secrets
    creationPolicy: Owner
  data:
    - secretKey: alice_password
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: alice_password }
    - secretKey: bob_password
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: bob_password }
    - secretKey: demoadm_password
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: demoadm_password }
    - secretKey: coder_client_secret
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: coder_client_secret }
    - secretKey: gitlab_client_secret
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: gitlab_client_secret }
    - secretKey: openshift_client_secret
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: openshift_client_secret }
    - secretKey: grafana_client_secret
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: grafana_client_secret }
---
# Coder OIDC client secret — consumed by the Coder server
# (CODER_OIDC_CLIENT_SECRET, see gitops/apps/coder/application.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oidc-client-secret
  namespace: coder
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: coder-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: coder_client_secret }
---
# OpenShift OAuth IdP client secret — key `clientSecret`, referenced by
# manifests/cluster-config/oauth-cluster.yaml (replaces the former
# keycloak-openshift-oidc-secret SealedSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-openshift-oidc-secret
  namespace: openshift-config
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-openshift-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: openshift_client_secret }
---
# Grafana OIDC client secret — key GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, consumed
# via envFromSecrets in gitops/apps/observability/application.yaml (replaces the
# former keycloak-grafana-oidc-secret SealedSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-grafana-oidc-secret
  namespace: coder-observability
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-grafana-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef: { key: rhsummit/keycloak/demo-realm, property: grafana_client_secret }
