# Keycloak demo-realm import — SECRET-FREE TEMPLATE.
#
# The persona passwords and OIDC client secrets are NOT stored here. They are
# generated by Terraform (terraform/keycloak-secrets.tf), stored in AWS Secrets
# Manager (rhsummit/keycloak/demo-realm), synced into this namespace by the
# External Secrets Operator as the Secret `keycloak-realm-secrets`, and injected
# into this template at apply time by the `keycloak-realm-import` Job
# (realm-import-job.yaml). The placeholders below (__ALICE_PW__, etc.) are
# replaced in-cluster; the rendered KeycloakRealmImport never touches git.
#
# To change identities/clients, edit this template. To rotate credentials,
# rotate them in AWS Secrets Manager (Terraform) — this file does not change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-template
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: coder-aigov-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  realm-demo.yaml: |
    ---
    apiVersion: k8s.keycloak.org/v2alpha1
    kind: KeycloakRealmImport
    metadata:
      name: demo-realm
      namespace: keycloak
      labels:
        app.kubernetes.io/name: keycloak-realm-demo
        app.kubernetes.io/part-of: coder-aigov-demo
    spec:
      keycloakCRName: keycloak
      realm:
        realm: demo
        enabled: true
        displayName: "RH Summit 2026 Demo Realm"
        displayNameHtml: "<strong>RH Summit 2026</strong> Demo Realm"
    
        # Disable self-registration. Only declared users can log in. The
        # whole point of the realm is reset-friendly known personas.
        registrationAllowed: false
        rememberMe: false
        verifyEmail: false
        loginWithEmailAllowed: true
        duplicateEmailsAllowed: false
        resetPasswordAllowed: false
    
        # Booth-grade — long enough that nobody hits the timeout during
        # the demo flow.
        accessTokenLifespan: 3600
        ssoSessionIdleTimeout: 28800
        ssoSessionMaxLifespan: 36000
    
        # ─── Groups ──────────────────────────────────────────────────────
        # One group per role tier — gives Coder/OCP/Grafana clean group→role
        # mappings without needing to encode role logic in each consumer.
        groups:
          - name: developers   # alice — Coder Member + chat/workspace org role
          - name: auditors     # bob   — Coder Auditor (read-only site-wide)
          - name: admins       # demoadm — Coder Owner + cluster-admin everywhere
    
        # ─── Demo users ──────────────────────────────────────────────────
        users:
          - username: alice
            enabled: true
            email: alice@demo.rhsummit.coderdemo.io
            firstName: Alice
            lastName: Anderson
            emailVerified: true
            credentials:
              - type: password
                value: "__ALICE_PW__"
                temporary: false
            groups:
              - /developers
          # Project-manager persona — Coder Auditor role (read-only audit log
          # + workspaces). Cannot start/stop workspaces or create chats.
          - username: bob
            enabled: true
            email: bob@demo.rhsummit.coderdemo.io
            firstName: Bob
            lastName: Brown
            emailVerified: true
            credentials:
              - type: password
                value: "__BOB_PW__"
                temporary: false
            groups:
              - /auditors
          # Admin-tier demo user. Stronger password than the developers
          # since this account elevates to OCP cluster-admin and Coder
          # owner. Booth-grade (rotate post-event). Note: demoadm is NOT
          # in /developers — the owner role at Coder + cluster-admin at
          # OCP supersede everything /developers would grant.
          - username: demoadm
            enabled: true
            email: demoadm@demo.rhsummit.coderdemo.io
            firstName: Demo
            lastName: Admin
            emailVerified: true
            credentials:
              - type: password
                value: "__DEMOADM_PW__"
                temporary: false
            groups:
              - /admins
    
        # ─── OIDC clients ────────────────────────────────────────────────
        clients:
          - clientId: coder
            name: "Coder (Workspace Platform)"
            protocol: openid-connect
            enabled: true
            clientAuthenticatorType: client-secret
            secret: "__CODER_CLIENT_SECRET__"
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            redirectUris:
              - "https://coder.apps.cluster.rhsummit.coderdemo.io/api/v2/users/oidc/callback"
            webOrigins:
              - "https://coder.apps.cluster.rhsummit.coderdemo.io"
            attributes:
              # Include `groups` claim in ID + access tokens
              "post.logout.redirect.uris": "https://coder.apps.cluster.rhsummit.coderdemo.io/*"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                consentRequired: false
                config:
                  "claim.name": "groups"
                  "full.path": "false"
                  "id.token.claim": "true"
                  "access.token.claim": "true"
                  "userinfo.token.claim": "true"
    
          - clientId: gitlab
            name: "GitLab (SCM)"
            protocol: openid-connect
            enabled: true
            clientAuthenticatorType: client-secret
            secret: "__GITLAB_CLIENT_SECRET__"
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            redirectUris:
              - "https://gitlab.rhsummit.coderdemo.io/users/auth/openid_connect/callback"
            webOrigins:
              - "https://gitlab.rhsummit.coderdemo.io"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                consentRequired: false
                config:
                  "claim.name": "groups"
                  "full.path": "false"
                  "id.token.claim": "true"
                  "access.token.claim": "true"
                  "userinfo.token.claim": "true"
    
          - clientId: openshift
            name: "OpenShift Console"
            protocol: openid-connect
            enabled: true
            clientAuthenticatorType: client-secret
            secret: "__OPENSHIFT_CLIENT_SECRET__"
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            redirectUris:
              # OCP OAuth callback URL format. The path segment after
              # /oauth2callback/ matches the identityProvider name in the
              # OAuth CR (we'll name it `keycloak` in cluster-config).
              - "https://oauth-openshift.apps.cluster.rhsummit.coderdemo.io/oauth2callback/keycloak"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                consentRequired: false
                config:
                  "claim.name": "groups"
                  "full.path": "false"
                  "id.token.claim": "true"
                  "access.token.claim": "true"
                  "userinfo.token.claim": "true"
    
          - clientId: grafana
            name: "Grafana (Observability)"
            protocol: openid-connect
            enabled: true
            clientAuthenticatorType: client-secret
            secret: "__GRAFANA_CLIENT_SECRET__"
            publicClient: false
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
            redirectUris:
              - "https://graf-coder.apps.cluster.rhsummit.coderdemo.io/login/generic_oauth"
            webOrigins:
              - "https://graf-coder.apps.cluster.rhsummit.coderdemo.io"
            protocolMappers:
              - name: groups
                protocol: openid-connect
                protocolMapper: oidc-group-membership-mapper
                consentRequired: false
                config:
                  "claim.name": "groups"
                  "full.path": "false"
                  "id.token.claim": "true"
                  "access.token.claim": "true"
                  "userinfo.token.claim": "true"
