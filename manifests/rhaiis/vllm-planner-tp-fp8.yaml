# vllm-planner-tp-fp8 — Tensor-parallel Llama 3.3 70B FP8 at 32K context
#
# Runs on the dedicated g6e.12xlarge node (4× L40S 48 GiB) provisioned
# by manifests/machinesets/gpu-l40s-tp-fp8.yaml. Uses all 4 GPUs via
# TP=4 + nodeSelector gpu-purpose=tensor-parallel-fp8.
#
# Why FP8 (over the existing INT4 production):
# At RH Summit demo testing on Llama 3.3 70B INT4 (w4a16), the model
# skipped the standard agentic probe step (no first-turn `pwd && ls`)
# and emitted training-prior paths — `/home/user/...`, `/workspace/...`,
# `/project/...` — that don't exist on Coder workspaces. The
# whack-a-mole workspace symlink fix landed and then was reverted
# (commits a61d6b9..d2f9d91, revert 3e93e91) because there's always
# another path Llama hasn't seen. Quantization is the root cause:
# INT4 erodes the calibrated probe-and-omit behavior; FP8 retains it.
#
# Why FP8 (over FP16):
# FP16 70B weights = ~140 GiB. Even at TP=4 across 4× L40S that leaves
# 35 GiB/GPU for weights with only ~13 GiB/GPU for KV cache at 0.95
# memory util — too tight for 32K context with concurrency. FP8-dynamic
# weights = ~70 GiB → 17.5 GiB/GPU for weights, leaves ~26 GiB/GPU for
# KV cache, plenty for 32K context across multiple concurrent sequences.
#
# Configuration:
#   --tensor-parallel-size 4 (uses all 4 GPUs on g6e.12xlarge)
#   --gpu-memory-utilization 0.95 (recover the framework reserve)
#   --max-model-len 32768 (32K context — booth-target window)
#   --enforce-eager (skip cudagraph compile)
#   --max-num-seqs 12 (cap concurrent seqs to realistic KV budget)
#   VLLM_USE_V1=0 (V1 engine deadlocks on Llama 70B — see §31)
#
# Weight split math (FP8-dynamic):
#   Llama 70B FP8 weights: ~70 GiB
#   TP=4 split: 17.5 GiB per GPU
#   Framework overhead per GPU: ~5 GiB
#   Free per GPU at gpu_memory_utilization 0.95: 48 * 0.95 - 17.5 - 5
#     = 23.1 GiB per GPU → 92.4 GiB total KV cache budget
#   32K context for 70B per sequence: ~5 GiB
#   Concurrent 32K sequences supported: ~18 (cap to 12 for booth headroom)
#
# Cutover: once `/v1/models` returns 200 here, the agents-config Job's
# openai-compat provider URL flips from vllm-planner-tp to
# vllm-planner-tp-fp8. INT4 stays as fallback until FP8 is verified at
# the booth.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-planner-tp-fp8
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  # First cold start: model download ~18 min (70 GiB FP8 weights) +
  # load split across 4 GPUs ~5 min + eager init ~1 min. 60 min ceiling.
  progressDeadlineSeconds: 3600
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: planner-tp-fp8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/component: planner-tp-fp8
    spec:
      imagePullSecrets:
        - name: redhat-pull-secret
      # Pin to the dedicated FP8 multi-GPU node.
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40S
        gpu-purpose: tensor-parallel-fp8
      containers:
        - name: vllm
          image: quay.io/modh/vllm:rhoai-2.20-cuda
          imagePullPolicy: Always
          args:
            - --model
            - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
            - --tool-call-parser
            - llama3_json
            - --enable-auto-tool-choice
            - --enforce-eager
            - --tensor-parallel-size
            - "4"
            - --gpu-memory-utilization
            - "0.95"
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "32768"
            - --max-num-seqs
            - "12"
            - --disable-log-requests
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_PORT
              value: "8000"
            # V1 engine deadlocks on Llama 70B (see decisions §31, §33)
            - name: VLLM_USE_V1
              value: "0"
          resources:
            requests:
              cpu: "8"
              memory: "64Gi"
              # All 4 L40S GPUs on this dedicated node.
              nvidia.com/gpu: "4"
            limits:
              cpu: "32"
              memory: "128Gi"
              nvidia.com/gpu: "4"
          # First cold start: download ~18 min + TP-4 load ~5 min +
          # engine init ~1 min = ~24 min. 50 min ceiling.
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 300
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          emptyDir:
            # 70 GiB FP8 weights + transient buffers — 120 GiB.
            sizeLimit: 120Gi
        - name: shm
          emptyDir:
            medium: Memory
            # TP-4 NCCL inter-GPU buffers — larger than TP-2.
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-planner-tp-fp8
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# ServiceMonitor — surfaces vllm:* metrics in UWM Prometheus so the
# existing vLLM dashboards automatically include this Deployment.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-planner-tp-fp8
  namespace: ocp-ai
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/component: planner-tp-fp8
    app.kubernetes.io/part-of: coder-aigov-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/component: planner-tp-fp8
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
