# Coder — installed via the upstream Helm chart, latest RC for full Coder
# Agents Early Access functionality.
#
# Values are inline below. For the demo we accept a few simplifications vs.
# production:
#   - Postgres connection comes from the `coder-app` Secret that the
#     CloudNativePG operator auto-generates when it reconciles the
#     `Cluster` CR in `manifests/postgres/cluster.yaml` (sync wave 0).
#   - `restricted-v2` SCC defaults are NOT overridden (no STIG/FIPS posture)
#   - Wildcard route is created via the Coder chart's ingress.openshift section
#
# Required Secrets in the `coder` namespace (NOT managed by this app — must
# exist before Coder pods schedule, otherwise they'll CrashLoopBackOff on
# env var lookup):
#
#   1. `coder-app`     — auto-created by CNPG (postgres URL).
#   2. `coder-secrets` — GitHub OAuth client ID/secret for the
#                        `demo-rhsummit-users` org. Keys:
#                            github-client-id
#                            github-client-secret
#                        Managed as a SealedSecret in
#                        manifests/secrets/coder-secrets.yaml; decrypted by
#                        the Bitnami controller (gitops/apps/sealed-secrets).
#                        See docs/secrets.md for the seal/rotate workflow.
#
# NOTES:
#   - The chart version + image tag track Coder release-candidate releases.
#     Bump as new RCs ship. Linear: project `0e26deb1` (Coder Agents) —
#     verify the May Beta milestone before booth.
#   - AWS Bedrock credentials are provided via IRSA. The cluster runs in
#     STS mode with a pod identity webhook. The bootstrap step annotates
#     the `coder` ServiceAccount with the Bedrock IAM role ARN, and the
#     webhook injects AWS_ROLE_ARN + token into the pod automatically.
#     AI Bridge picks up Bedrock via the same SDK path — no static keys.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.coder.com/v2
    chart: coder
    targetRevision: 2.33.2            # latest stable (Coder Agents beta — no longer behind an experiment flag)
    helm:
      releaseName: coder
      values: |
        coder:
          image:
            repo: ghcr.io/coder/coder
            tag: v2.33.2               # match chart targetRevision (latest stable as of 2026-05-11)
            pullPolicy: IfNotPresent

          # Prometheus scrape annotations on every pod
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "2112"

          env:
            # ── Core URLs ───────────────────────────────────────────────
            - name: CODER_ACCESS_URL
              value: "https://coder.apps.cluster.rhsummit.coderdemo.io"   # update to your cluster_fqdn
            - name: CODER_WILDCARD_ACCESS_URL
              value: "*.coder.apps.cluster.rhsummit.coderdemo.io"
            # Coder writes its build cache here. The chart mounts an
            # emptyDir at /tmp (see volumes/volumeMounts below) so the
            # restricted-v2 SCC's readOnlyRootFilesystem stays satisfied.
            - name: CODER_CACHE_DIRECTORY
              value: /tmp/coder

            # ── Postgres (CNPG-generated) ───────────────────────────────
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-app          # auto-generated by CNPG operator
                  key: uri

            # ── Security headers + cookie hardening ─────────────────────
            - name: CODER_DISABLE_PATH_APPS
              value: "true"
            - name: CODER_SECURE_AUTH_COOKIE
              value: "true"
            - name: CODER_STRICT_TRANSPORT_SECURITY
              value: "31536000"

            # ── Token lifetimes ─────────────────────────────────────────
            # The "admin" cap (CODER_MAX_ADMIN_TOKEN_LIFETIME) defaults
            # to 168h (7d) and applies to Owner/Admin users — too short
            # for the GH Actions template-push token, which is created
            # by an Owner (ausbru87). The non-admin cap
            # (CODER_MAX_TOKEN_LIFETIME) already defaults to 876600h
            # (100y), so we only need to raise the admin one.
            #
            # 1y bound. Token lives in GH Actions secrets, scoped to
            # template push, and rotated when the Coder version bumps
            # or the SA-equivalent pattern changes.
            - name: CODER_MAX_ADMIN_TOKEN_LIFETIME
              value: "8760h"

            # ── Auth: dual IdP — GitHub OAuth (admins) + Keycloak OIDC (demo users) ──
            # Password auth disabled. Two SSO paths:
            #   - GitHub OAuth: filtered to `demo-rhsummit-users` org;
            #     admin-tier (Coder team, SE presenters using their
            #     personal GH account in that org). Original IdP.
            #   - Keycloak OIDC: realm `demo` on the in-cluster RHBK
            #     instance; demo-user personas (alice/bob/carol/dave/madmin).
            #     Added 2026-05-10 per docs/identity-architecture.md.
            #
            # Both run simultaneously — the Coder login page shows two
            # "Sign in with..." buttons. See docs/decisions.md §33
            # (forthcoming) for the dual-IdP rationale.
            - name: CODER_DISABLE_PASSWORD_AUTH
              value: "true"

            # GitHub OAuth — admin path
            - name: CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS
              value: "true"
            - name: CODER_OAUTH2_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: github-client-id
            - name: CODER_OAUTH2_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: github-client-secret
            - name: CODER_OAUTH2_GITHUB_ALLOWED_ORGS
              value: "demo-rhsummit-users"

            # Keycloak OIDC — demo-user path. Issuer URL points at the
            # in-cluster RHBK demo realm; Coder fetches the OIDC discovery
            # doc and derives auth/token/userinfo endpoints automatically.
            # Client secret is the booth-grade hardcoded value in
            # manifests/keycloak/realm-demo.yaml; for prod, move to
            # the coder-secrets SealedSecret with a `oidc-client-secret` key.
            - name: CODER_OIDC_ISSUER_URL
              value: "https://keycloak.apps.cluster.rhsummit.coderdemo.io/realms/demo"
            - name: CODER_OIDC_CLIENT_ID
              value: "coder"
            - name: CODER_OIDC_CLIENT_SECRET
              value: "coder-client-secret-demo-2026"
            - name: CODER_OIDC_SIGN_IN_TEXT
              value: "Sign in with Keycloak (demo users)"
            - name: CODER_OIDC_ICON_URL
              value: "https://www.keycloak.org/resources/images/keycloak_icon_512px.svg"
            # Auto-create Coder user records on first OIDC login.
            - name: CODER_OIDC_ALLOW_SIGNUPS
              value: "true"
            # Match users on the OIDC `email` claim (Keycloak emits this
            # from the user record we set in realm-demo.yaml).
            - name: CODER_OIDC_EMAIL_FIELD
              value: "email"
            # Trust Keycloak's email_verified claim — our demo users
            # have emailVerified: true in the realm import, so this is
            # always true. Setting it false would let unverified users
            # log in too; we don't want that even in booth.
            - name: CODER_OIDC_IGNORE_EMAIL_VERIFIED
              value: "false"
            # Map the OIDC `groups` claim into Coder's group sync so
            # the `developers` group from Keycloak becomes a Coder
            # group of the same name (users land in it on login).
            - name: CODER_OIDC_GROUP_FIELD
              value: "groups"
            - name: CODER_OIDC_GROUP_AUTO_CREATE
              value: "true"
            # Scopes: standard OIDC only — `groups` is emitted via
            # client-level protocol mapper, not a registered Keycloak
            # client scope. Requesting it would trigger "Invalid scopes".
            - name: CODER_OIDC_SCOPES
              value: "openid,profile,email"

            # ── Site-level OIDC role sync (Premium-gated) ────────────────
            # Maps Keycloak `groups` claim values to built-in Coder site
            # roles on every login. `developers` -> `auditor` gives demo
            # personas site-wide READ across deployment_config, audit_log,
            # aibridge_interception, etc. `admins` -> `owner` gives madmin
            # full control.
            #
            # The custom org-scoped role `developers-auditor-plus` (which
            # adds workspace.create + chat.*) is bootstrapped by the
            # coder-agents-config Job — site sync ignores custom role
            # names, so the org-scoped sync is configured via PATCH on
            # /organizations/{id}/settings/idpsync/roles. Together they
            # give the persona the full "read everything + create my
            # own workspace+chat" surface.
            - name: CODER_OIDC_USER_ROLE_FIELD
              value: "groups"
            - name: CODER_OIDC_USER_ROLE_MAPPING
              value: '{"developers":["auditor"],"admins":["owner"]}'

            # ── External git auth (GitLab self-hosted) ──────────────────
            # Workspaces clone/push against the booth's self-hosted
            # GitLab (gitlab.rhsummit.coderdemo.io). The OAuth app
            # `coder-workspace-external-auth` was bootstrapped via the
            # `scripts/gitlab-create-coder-oauth-app.sh` helper; its
            # client_id + client_secret live in the
            # `gitlab-coder-external-auth` SealedSecret (created from
            # /tmp/gitlab-coder-external-auth-plain.yaml).
            #
            # GitHub external_auth is deprecated for the demo flow
            # (per the identity pivot). GitHub *login* (CODER_OAUTH2_
            # GITHUB_*) stays as the admin-tier IdP — only the workspace
            # git push surface moves to GitLab.
            - name: CODER_EXTERNAL_AUTH_0_TYPE
              value: "gitlab"
            - name: CODER_EXTERNAL_AUTH_0_ID
              value: "gitlab"
            - name: CODER_EXTERNAL_AUTH_0_DISPLAY_NAME
              value: "GitLab (Demo)"
            - name: CODER_EXTERNAL_AUTH_0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gitlab-coder-external-auth
                  key: client-id
            - name: CODER_EXTERNAL_AUTH_0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitlab-coder-external-auth
                  key: client-secret
            # Self-hosted GitLab — Coder's built-in defaults point at
            # gitlab.com; override. Endpoints match the proven config
            # at lab/k3s-infra/helm-values/coder.yaml.
            - name: CODER_EXTERNAL_AUTH_0_AUTH_URL
              value: "https://gitlab.rhsummit.coderdemo.io/oauth/authorize"
            - name: CODER_EXTERNAL_AUTH_0_TOKEN_URL
              value: "https://gitlab.rhsummit.coderdemo.io/oauth/token"
            # `/oauth/token/info` is the OAuth2 token-info endpoint —
            # validates the access token itself with no scope requirement.
            # `/api/v4/user` requires read_user and was producing
            # 403s on validate.
            - name: CODER_EXTERNAL_AUTH_0_VALIDATE_URL
              value: "https://gitlab.rhsummit.coderdemo.io/oauth/token/info"
            # Lets users disconnect cleanly + revoke the issued token.
            - name: CODER_EXTERNAL_AUTH_0_REVOKE_URL
              value: "https://gitlab.rhsummit.coderdemo.io/oauth/revoke"
            # Match any HTTPS clone of a GitLab project on this host.
            - name: CODER_EXTERNAL_AUTH_0_REGEX
              value: "^https://gitlab\\.rhsummit\\.coderdemo\\.io/.*"
            # Scopes Coder requests when initiating the OAuth flow.
            # SPACE-separated per RFC 6749 (commas produce GitLab's
            # "requested scope is invalid, unknown, or malformed").
            # - `api`            : full API surface (covers read_user)
            # - `write_repository`: git push
            # - `read_registry`  : pull from GitLab container registry
            # - `write_registry` : push to GitLab container registry
            #                      (relevant once registry.gitlab.<dom>
            #                      is live, which it is)
            - name: CODER_EXTERNAL_AUTH_0_SCOPES
              value: "api write_repository read_registry write_registry"

            # ── External provisioner mode ───────────────────────────────
            # Disable in-process provisioners; the coder-provisioner
            # Deployment (gitops/apps/coder-provisioner/) handles all
            # template builds.
            - name: CODER_PROVISIONER_DAEMONS
              value: "0"

            # ── AI Bridge ───────────────────────────────────────────────
            # Bedrock-only via IRSA — the pod identity webhook injects
            # AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE from the `coder`
            # ServiceAccount annotation. AI Bridge picks Bedrock up
            # through the standard AWS SDK credential chain.
            #
            # OpenAI is a separate matter — Bedrock doesn't host
            # GPT models, so AI Bridge needs a real upstream OpenAI
            # API key for /api/v2/aibridge/openai/* requests (Codex
            # CLI, GPT-5/4 traffic). Sourced from the existing
            # `coder-secrets` SealedSecret under the `openai-api-key`
            # data key. ALLOW_BYOK=false forces all workspace traffic
            # through this central key (keeps the audit trail intact;
            # without it, users could set OPENAI_API_KEY directly to
            # a personal key and bypass governance).
            #
            # Anthropic still routes via Bedrock + IRSA; no API key
            # required there.
            - name: CODER_AIBRIDGE_ENABLED
              value: "true"
            - name: CODER_AIBRIDGE_STRUCTURED_LOGGING
              value: "true"
            - name: CODER_AIBRIDGE_RETENTION
              value: "30d"
            - name: CODER_AIBRIDGE_OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: openai-api-key
            - name: CODER_AIBRIDGE_ALLOW_BYOK
              value: "false"
            - name: AWS_REGION
              value: "us-east-1"

            # ── AI Gateway: Anthropic via Bedrock (IRSA) ────────────────
            # Indexed provider config tells AI Gateway to route Anthropic
            # API traffic to Bedrock. No static keys — the AWS SDK picks
            # up credentials from the IRSA-projected token on the pod.
            # BEDROCK_MODEL maps the default/primary model; Claude Code
            # sends Anthropic-native model names which AI Gateway resolves
            # to Bedrock inference profile IDs.
            - name: CODER_AIBRIDGE_PROVIDER_0_TYPE
              value: "anthropic"
            - name: CODER_AIBRIDGE_PROVIDER_0_NAME
              value: "anthropic"
            - name: CODER_AIBRIDGE_PROVIDER_0_BEDROCK_REGION
              value: "us-east-1"
            - name: CODER_AIBRIDGE_PROVIDER_0_BEDROCK_MODEL
              value: "us.anthropic.claude-sonnet-4-20250514-v1:0"
            - name: CODER_AIBRIDGE_PROVIDER_0_BEDROCK_SMALL_FAST_MODEL
              value: "us.anthropic.claude-sonnet-4-20250514-v1:0"

            # ── Coder Agents (beta) ─────────────────────────────────────
            # The CODER_EXPERIMENTS=agents flag was removed in v2.33.2
            # (PR #24432). Agents are on by default in beta — no env
            # var required.

            # ── Telemetry / direct-connect off for demo network ─────────
            - name: CODER_DISABLE_DIRECT_CONNECTIONS
              value: "true"
            - name: CODER_DISABLE_NETWORK_TELEMETRY
              value: "true"
            - name: CODER_DISABLE_USAGE_STATS
              value: "true"

            # ── Prometheus ──────────────────────────────────────────────
            - name: CODER_PROMETHEUS_ENABLE
              value: "true"
            - name: CODER_PROMETHEUS_ADDRESS
              value: "0.0.0.0:2112"
            - name: CODER_PROMETHEUS_COLLECT_AGENT_STATS
              value: "true"

          replicaCount: 3     # multi-AZ HA — one pod per AZ via topology spread below

          # Use OpenShift Routes via the chart's built-in support
          ingress:
            enable: false      # We'll create OpenShift Route separately if needed

          serviceAccount:
            name: coder-server
            workspacePerms: true
            enableDeployments: true
            annotations:
              eks.amazonaws.com/role-arn: "arn:aws:iam::342934376218:role/demo/cluster-coder-bedrock"

          # OpenShift restricted-v2 SCC compliance (per docs.coder.com/install/openshift)
          securityContext:
            runAsNonRoot: true
            runAsUser: null
            runAsGroup: null
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault

          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 1Gi

          volumeMounts:
            - name: cache
              mountPath: /tmp
              readOnly: false

          service:
            type: ClusterIP

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # Spread the 3 Coder pods across the 3 OCP node AZs so a single AZ
          # outage takes at most one replica. Aurora Postgres failover (writer
          # endpoint repoint) is automatic and survives the same AZ event.
          # Converged-cluster scheduling: masters are made schedulable via
          # Scheduler/cluster.spec.mastersSchedulable=true (owned by
          # gitops/apps/cluster-config/), so no master toleration is needed.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: coder

          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: coder
                    topologyKey: kubernetes.io/hostname

  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
