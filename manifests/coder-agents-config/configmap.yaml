# GENERATED BY scripts/render-coder-agents-configmap.sh — DO NOT EDIT BY HAND.
#
# Source of truth:
#   scripts/coder-agents-provider-model-config.sh (the bootstrap script)
#   manifests/coder-agents-config/system-prompt.md (Coder Agents system prompt appendix)
#   manifests/coder-agents-config/plan-mode-instructions.md (Coder Agents plan-mode instructions)
#
# After editing any of those source files, run:
#   ./scripts/render-coder-agents-configmap.sh
# and commit the regenerated configmap.yaml in the same change.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-agents-config-script
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-agents-config
    app.kubernetes.io/part-of: coder-aigov-demo
data:
  coder-agents-provider-model-config.sh: |
    #!/usr/bin/env bash
    # Configure Coder Agents (chatd) providers and model-configs for the
    # Bedrock + RHAIIS booth demo.
    #
    # What it creates / updates (idempotent — PATCH on existing rows so
    # chat_messages FKs to model_config_id stay intact):
    #
    #   Provider 1 — AWS Bedrock
    #     provider:    "bedrock"
    #     api_key:     <none — uses IRSA on the coder-server SA>
    #     base_url:    https://bedrock-runtime.<region>.amazonaws.com
    #
    #   Provider 2 — RHAIIS (sovereign Granite, OpenAI-compatible vLLM)
    #     provider:    "openai-compat"   (NOT "openai" — chatd treats them
    #                                     as distinct types; "openai-compat"
    #                                     is the right type for any vLLM /
    #                                     LM Studio / Ollama style upstream)
    #     api_key:     "EMPTY" (RHAIIS has no auth)
    #     base_url:    http://vllm.ocp-ai.svc.cluster.local:8000/v1
    #
    #   Models
    #     - An explicit allowlist of Anthropic Opus + Sonnet Bedrock inference
    #       profile IDs that are subscribed account-wide. Each is registered
    #       with a friendly display name; the newest Opus is the default.
    #     - One RHAIIS Granite model.
    #
    #   Why an allowlist instead of dynamic discovery:
    #     `aws bedrock list-inference-profiles` returns ~16 Anthropic profiles
    #     in us-east-1, but only a subset is actually invocable —
    #     account-wide AWS Marketplace subscription must have been completed
    #     for each profile by a `aws-marketplace:Subscribe`-permitted
    #     principal. Registering an unsubscribed model surfaces a 403
    #     "AWS Marketplace subscription cannot be completed" the first time
    #     it's invoked, which the Coder Agents UI renders as
    #     "Authentication failed." We pin to the verified-subscribed set so
    #     the picker only contains models that work. See `bedrock-model-sub.md`
    #     for how to extend this list when AWS adds a new model.
    #
    # Why inference profiles, not raw foundation model IDs:
    #   Anthropic Claude 4+ models on Bedrock require an inference profile
    #   (cross-region, e.g. `us.anthropic.claude-opus-4-...-v1:0`). The
    #   profile IDs are stable and the right thing to put in the
    #   `model_config.model` field.
    #
    # Usage (laptop, ad-hoc):
    #   export CODER_URL=https://coder.apps.<cluster-domain>
    #   export CODER_TOKEN=<owner-session-token>
    #   export AWS_REGION=us-east-1
    #   ./scripts/coder-agents-provider-model-config.sh
    #
    # Usage (in-cluster, via the Argo CD-managed Job):
    #   The Job pod injects CODER_URL, CODER_TOKEN (from a SealedSecret),
    #   AWS_REGION, RHAIIS_BASE_URL, and assumes the IRSA role on the
    #   `coder-server` ServiceAccount so `aws bedrock list-...` works.
    #
    # Falling back to AI-Bridge-fronted Bedrock (if chatd's `bedrock`
    # provider type doesn't work in your Coder build):
    #   set BEDROCK_PROVIDER_MODE=aibridge
    #   The script will then create/update an `anthropic`-type provider
    #   pointing at ${CODER_URL}/api/v2/aibridge/anthropic, bootstrapping a
    #   `chatd-aibridge` Coder service-account token for AI Bridge auth (the
    #   same pattern as the k3s-infra reference script).
    
    set -euo pipefail
    
    : "${CODER_URL:?CODER_URL must be set}"
    : "${CODER_TOKEN:?CODER_TOKEN must be set}"
    : "${AWS_REGION:=us-east-1}"
    
    # RHAIIS — single openai-compat provider for tonight's booth shape.
    # A planner+executor split exists at the manifest layer (vllm-planner
    # + vllm-executor Deployments in manifests/rhaiis/vllm-deployment.yaml),
    # but chatd's database has a UNIQUE constraint on the `provider` type
    # column — only ONE openai-compat provider can exist at a time. Routing
    # multiple vLLM backends behind one chatd provider needs a router
    # (LiteLLM / llm-d / Coder AI Gateway when it lands) sitting between
    # chatd and the two vLLM Services. Until that lands, we register the
    # heavier of the two backends (Llama 3.3 70B INT4 on L40S) — the
    # 70B's reasoning is what drives reliable sub-agent flow logic and
    # template selection in Coder Agents' 19-tool harness. The
    # vllm-executor Qwen 2.5 7B Deployment is left running (warm) so the
    # router-driven swap is a config-only change, not a redeploy. See
    # docs/decisions.md §27 + §28 for the full reasoning.
    : "${RHAIIS_BASE_URL:=http://vllm-planner.ocp-ai.svc.cluster.local:8000/v1}"
    : "${RHAIIS_MODEL_ID:=Qwen/Qwen2.5-32B-Instruct-AWQ}"
    : "${RHAIIS_DISPLAY_NAME:=Qwen 2.5 32B Instruct AWQ (RHAIIS sovereign)}"
    : "${RHAIIS_PROVIDER_DISPLAY:=RHAIIS (Sovereign Qwen 2.5 32B Instruct)}"
    
    : "${BEDROCK_PROVIDER_MODE:=native}"   # native | aibridge
    
    BASE="${CODER_URL%/}/api/experimental/chats"
    V2="${CODER_URL%/}/api/v2"
    AUTH="Coder-Session-Token: ${CODER_TOKEN}"
    
    require() {
      command -v "$1" >/dev/null 2>&1 || { echo "ERROR: '$1' is required on PATH" >&2; exit 1; }
    }
    require curl
    require jq
    require aws
    require python3
    
    # ---------------------------------------------------------------------------
    # Helpers
    # ---------------------------------------------------------------------------
    
    patch_provider() {
      # Returns the provider ID on stdout (for capturing after upsert).
      # Logs a brief summary to stderr.
      local id="$1" payload="$2"
      local resp
      resp=$(curl -sf -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
        -d "$payload" "${BASE}/providers/${id}")
      echo "$resp" | jq '{id,provider,display_name,base_url,has_api_key}' >&2
      echo "$resp" | jq -r '.id'
    }
    
    create_provider() {
      # Returns the new provider ID on stdout.
      local payload="$1"
      local resp
      resp=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
        -d "$payload" "${BASE}/providers")
      echo "$resp" | jq '{id,provider,display_name,base_url,has_api_key}' >&2
      echo "$resp" | jq -r '.id'
    }
    
    upsert_provider() {
      # Match on (provider type, source=database) so chart-injected providers
      # don't collide with the rows we own. For provider types that we use
      # MULTIPLE TIMES (e.g. two openai-compat backends — planner + executor),
      # pass a non-empty $3 (display_name) and we'll match on
      # (type, display_name) instead.
      #
      # Prints a one-line summary to stderr and the resulting provider ID
      # on stdout (so callers can capture: `pid=$(upsert_provider …)`).
      local provider_type="$1" payload="$2" display_name="${3:-}"
      local existing_id
      if [ -n "$display_name" ]; then
        existing_id=$(echo "$EXISTING_PROVIDERS" \
          | jq -r --arg p "$provider_type" --arg n "$display_name" \
            '.[] | select(.provider == $p and .source == "database" and .display_name == $n) | .id' \
          | head -1)
      else
        existing_id=$(echo "$EXISTING_PROVIDERS" \
          | jq -r --arg p "$provider_type" '.[] | select(.provider == $p and .source == "database") | .id' \
          | head -1)
      fi
    
      if [ -n "$existing_id" ]; then
        echo "    Updating ${provider_type}${display_name:+ (\"$display_name\")} provider (${existing_id})..." >&2
        patch_provider "$existing_id" "$payload"
      else
        echo "    Creating ${provider_type}${display_name:+ (\"$display_name\")} provider..." >&2
        create_provider "$payload"
      fi
    }
    
    upsert_model_by_name() {
      # Keyed on display_name — the same Bedrock model ID can show up more
      # than once (e.g. with and without extended-thinking provider_options),
      # so display_name is the stable, human-meaningful key.
      local display_name="$1" payload="$2"
      local existing_uuid
      existing_uuid=$(echo "$EXISTING_MODELS" \
        | jq -r --arg n "$display_name" '.[] | select(.display_name == $n) | .id' \
        | head -1)
    
      if [ -n "$existing_uuid" ]; then
        echo "    Updating \"${display_name}\" (${existing_uuid})..."
        curl -sf -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
          -d "$payload" "${BASE}/model-configs/${existing_uuid}" \
          | jq '{id,provider,model,display_name,is_default}'
      else
        echo "    Creating \"${display_name}\"..."
        curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
          -d "$payload" "${BASE}/model-configs" \
          | jq '{id,provider,model,display_name,is_default}'
      fi
    }
    
    # Friendly name from a Bedrock inference-profile ID. Implemented in
    # Python — the regex/grouping logic was painful to keep correct in
    # pure bash across the variety of profile-ID shapes Anthropic ships
    # (some have a date stamp + -v1, some only -v1, some neither).
    #
    #   global.anthropic.claude-opus-4-7              -> "Claude Opus 4.7 [GLOBAL]"
    #   us.anthropic.claude-opus-4-5-20251101-v1:0    -> "Claude Opus 4.5 (2025-11-01) [US]"
    #   us.anthropic.claude-3-opus-20240229-v1:0      -> "Claude 3 Opus (2024-02-29) [US]"
    format_display_name() {
      python3 - "$1" <<'PY'
    import re, sys
    mid = sys.argv[1]
    m = re.match(r'^(global|us|eu|apac)\.', mid)
    region = m.group(1).upper() if m else ''
    mid = re.sub(r'^(global|us|eu|apac)\.', '', mid)
    mid = mid.replace('anthropic.', '', 1)
    if mid.endswith(':0'):
        mid = mid[:-2]
    date = ''
    md = re.search(r'-(\d{8})(?:-v\d+)?$', mid)
    if md:
        date = md.group(1)
        mid = mid[:md.start()]
    mid = re.sub(r'-v\d+$', '', mid)
    parts = mid.split('-')
    out, i = [], 0
    while i < len(parts):
        p = parts[i]
        if p == 'claude':
            out.append('Claude')
        elif p.isdigit():
            run = [p]
            while i + 1 < len(parts) and parts[i+1].isdigit():
                run.append(parts[i+1]); i += 1
            out.append('.'.join(run))
        else:
            out.append(p.capitalize())
        i += 1
    name = ' '.join(out)
    if date:
        name += f" ({date[:4]}-{date[4:6]}-{date[6:]})"
    if region:
        name += f" [{region}]"
    print(name)
    PY
    }
    
    # Sort key so the newest model becomes the default. Strips everything
    # except the date stamp; missing dates sort lowest.
    date_key() {
      echo "$1" | grep -oE '[0-9]{8}' | head -1 || echo "00000000"
    }
    
    # ---------------------------------------------------------------------------
    # Sanity checks
    # ---------------------------------------------------------------------------
    
    echo "==> Coder API reachable?"
    curl -sf -o /dev/null -H "$AUTH" "${V2}/users/me" \
      || { echo "ERROR: ${V2}/users/me returned non-200 — check CODER_URL/CODER_TOKEN" >&2; exit 1; }
    echo "    OK"
    
    echo ""
    echo "==> Bedrock reachable in region ${AWS_REGION}?"
    # `aws bedrock list-foundation-models` is non-paginated; --max-results
    # isn't an accepted flag on the v2 CLI (errors with "Unknown options:
    # --max-results, 1"). Use --query to truncate output instead.
    aws bedrock list-foundation-models --region "$AWS_REGION" \
        --query 'modelSummaries[0].modelId' --output text >/dev/null \
      || { echo "ERROR: aws bedrock failed — check IRSA / AWS_REGION / SSO" >&2; exit 1; }
    echo "    OK"
    
    # ---------------------------------------------------------------------------
    # Optional AI-Bridge SA bootstrap (only when BEDROCK_PROVIDER_MODE=aibridge)
    # ---------------------------------------------------------------------------
    
    SVC_TOKEN=""
    if [ "$BEDROCK_PROVIDER_MODE" = "aibridge" ]; then
      echo ""
      echo "==> Ensuring chatd-aibridge service account (BEDROCK_PROVIDER_MODE=aibridge)..."
      SVC_USER_ID=$(curl -sf -H "$AUTH" "${V2}/users/chatd-aibridge" 2>/dev/null | jq -r '.id // empty')
      if [ -z "$SVC_USER_ID" ]; then
        echo "    Creating service account..."
        ORG_ID=$(curl -sf -H "$AUTH" "${V2}/organizations" | jq -r '.[0].id')
        SVC_USER_ID=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
          -d "$(jq -n --arg org "$ORG_ID" '{
            username:"chatd-aibridge",
            email:"chatd-aibridge@coder.local",
            name:"chatd AI Bridge",
            login_type:"none",
            organization_ids:[$org]
          }')" "${V2}/users" | jq -r '.id')
        echo "    Created ${SVC_USER_ID}"
      else
        echo "    Exists: ${SVC_USER_ID}"
      fi
      echo "    Minting long-lived token..."
      SVC_TOKEN=$(curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" \
        -d '{"lifetime": 3155760000000000000, "token_name": "chatd-aibridge-token"}' \
        "${V2}/users/chatd-aibridge/keys/tokens" | jq -r '.key')
    
      HTTP=$(curl -so /dev/null -w "%{http_code}" \
        -H "Authorization: Bearer $SVC_TOKEN" \
        "${CODER_URL%/}/api/v2/aibridge/anthropic/v1/models" || true)
      if [ "$HTTP" != "200" ]; then
        echo "WARN: AI Bridge anthropic /v1/models returned HTTP ${HTTP} — continuing, models may still work" >&2
      else
        echo "    Token validated against AI Bridge"
      fi
    fi
    
    # ---------------------------------------------------------------------------
    # Provider configuration
    # ---------------------------------------------------------------------------
    
    echo ""
    echo "==> Fetching existing providers..."
    EXISTING_PROVIDERS=$(curl -sf -H "$AUTH" "${BASE}/providers")
    
    echo ""
    case "$BEDROCK_PROVIDER_MODE" in
      native)
        echo "==> Configuring Bedrock provider (native, IRSA-backed)..."
        # The chatd `bedrock` provider type uses the AWS SDK credential
        # chain. Setting base_url is how chatd learns the region; the chats
        # API silently drops `provider_options.bedrock.region`, so we encode
        # the region in the URL exactly the way AI Bridge does.
        BEDROCK_PROVIDER_PAYLOAD=$(jq -n --arg url "https://bedrock-runtime.${AWS_REGION}.amazonaws.com" '{
          provider: "bedrock",
          display_name: "AWS Bedrock (IRSA)",
          base_url: $url,
          central_api_key_enabled: true,
          allow_user_api_key: false
        }')
        upsert_provider "bedrock" "$BEDROCK_PROVIDER_PAYLOAD"
        ;;
      aibridge)
        echo "==> Configuring Bedrock provider (via AI Bridge anthropic endpoint)..."
        BEDROCK_PROVIDER_PAYLOAD=$(jq -n \
          --arg url "${CODER_URL%/}/api/v2/aibridge/anthropic" \
          --arg key "$SVC_TOKEN" '{
          provider: "anthropic",
          display_name: "AWS Bedrock (via AI Bridge)",
          base_url: $url,
          api_key: $key,
          central_api_key_enabled: true,
          allow_user_api_key: false
        }')
        upsert_provider "anthropic" "$BEDROCK_PROVIDER_PAYLOAD"
        ;;
      *)
        echo "ERROR: BEDROCK_PROVIDER_MODE must be 'native' or 'aibridge'" >&2
        exit 1
        ;;
    esac
    
    echo ""
    echo "==> Configuring RHAIIS provider (direct, OpenAI-compatible)..."
    RHAIIS_PROVIDER_PAYLOAD=$(jq -n \
      --arg url "$RHAIIS_BASE_URL" \
      --arg name "$RHAIIS_PROVIDER_DISPLAY" '{
      provider: "openai-compat",
      display_name: $name,
      base_url: $url,
      api_key: "EMPTY",
      central_api_key_enabled: true,
      allow_user_api_key: false
    }')
    RHAIIS_PROVIDER_ID=$(upsert_provider "openai-compat" "$RHAIIS_PROVIDER_PAYLOAD")
    echo "    -> RHAIIS provider id: $RHAIIS_PROVIDER_ID"
    
    # ---------------------------------------------------------------------------
    # Bedrock Anthropic Opus + Sonnet models — explicit allowlist
    # ---------------------------------------------------------------------------
    #
    # These inference profile IDs were verified subscribed + invocable from
    # the IRSA role on 2026-05-09 (kiro-cli, ocp-deploy-acct profile). See
    # `bedrock-model-sub.md` for the full subscription log and how to extend
    # this list:
    #   1. Run the discovery query in that doc to find new profiles.
    #   2. Subscribe each via `aws bedrock-runtime converse` from a
    #      marketplace-permitted principal.
    #   3. Add the verified profile ID to ALL_IDS below and re-render the
    #      configmap (`./scripts/render-coder-agents-configmap.sh`).
    #
    # Haiku is intentionally excluded — `claude-haiku-4-5-20251001-v1:0`
    # requires the Anthropic use-case form in the Bedrock console (the only
    # subscription that the marketplace-permitted bedrock-runtime invoke
    # can't complete on its own). When that form is approved, add it here.
    
    ALL_IDS=$(cat <<'IDS'
    us.anthropic.claude-sonnet-4-20250514-v1:0
    us.anthropic.claude-sonnet-4-6
    us.anthropic.claude-sonnet-4-5-20250929-v1:0
    us.anthropic.claude-opus-4-7
    us.anthropic.claude-opus-4-6-v1
    us.anthropic.claude-opus-4-5-20251101-v1:0
    us.anthropic.claude-opus-4-1-20250805-v1:0
    IDS
    )
    
    # Demo primary is Sonnet 4 (cheapest of the working set, plenty capable
    # for booth Q&A). Override at deploy-time by exporting DEFAULT_MODEL_ID
    # before running the script.
    : "${DEFAULT_MODEL_ID:=us.anthropic.claude-sonnet-4-20250514-v1:0}"
    
    echo ""
    echo "==> Subscribed Anthropic Opus/Sonnet inference profiles to register:"
    echo "$ALL_IDS" | sed 's/^/      /'
    echo ""
    echo "    Default model will be: ${DEFAULT_MODEL_ID}"
    
    # ---------------------------------------------------------------------------
    # Create / update model-configs
    # ---------------------------------------------------------------------------
    
    echo ""
    echo "==> Fetching existing model-configs..."
    EXISTING_MODELS=$(curl -sf -H "$AUTH" "${BASE}/model-configs")
    
    # Bedrock Anthropic pricing (per Anthropic's published rates; AWS bills
    # at the same per-token rate via Bedrock).
    OPUS_COST='{"input_price_per_million_tokens":15,"output_price_per_million_tokens":75,"cache_read_price_per_million_tokens":1.5,"cache_write_price_per_million_tokens":18.75}'
    SONNET_COST='{"input_price_per_million_tokens":3,"output_price_per_million_tokens":15,"cache_read_price_per_million_tokens":0.3,"cache_write_price_per_million_tokens":3.75}'
    HAIKU_COST='{"input_price_per_million_tokens":0.8,"output_price_per_million_tokens":4,"cache_read_price_per_million_tokens":0.08,"cache_write_price_per_million_tokens":1}'
    
    bedrock_provider_for_model() {
      # Returns the chatd provider type to assign to a Bedrock model.
      case "$BEDROCK_PROVIDER_MODE" in
        native)   echo "bedrock"   ;;
        aibridge) echo "anthropic" ;;
      esac
    }
    
    cost_for_model() {
      case "$1" in
        *opus*)   echo "$OPUS_COST"   ;;
        *sonnet*) echo "$SONNET_COST" ;;
        *haiku*)  echo "$HAIKU_COST"  ;;
        *)        echo "$SONNET_COST" ;;
      esac
    }
    
    context_for_model() {
      # Claude 3.5/4/4.5/4.6/4.7 are 200K base; the 1M-context Sonnet 4 / Opus 4
      # tier exists but isn't always enabled per-account. Stick with 200K to be
      # safe. Adjust if your Bedrock account has the 1M-context inference
      # profile enabled.
      echo 200000
    }
    
    provider_options_for_model() {
      # Extended-thinking flag for Opus/Sonnet models. Field name is
      # `effort: "max"` under the provider's sub-key:
      #   - "anthropic" provider: provider_options.anthropic.effort = "max"
      #   - "bedrock"   provider: provider_options.bedrock.effort   = "max"
      # Returns "{}" when no options apply (chatd accepts an empty object).
      local model_id="$1" effort="$2" provider_type="$3"
      if [ -n "$effort" ]; then
        jq -n --arg p "$provider_type" --arg e "$effort" '{ ($p): { effort: $e } }'
      else
        echo '{}'
      fi
    }
    
    echo ""
    echo "==> Configuring Bedrock Anthropic models..."
    PROVIDER_TYPE=$(bedrock_provider_for_model)
    
    for model_id in $ALL_IDS; do
      display=$(format_display_name "$model_id")
      cost=$(cost_for_model "$model_id")
      context=$(context_for_model "$model_id")
      is_default="false"
      [ "$model_id" = "$DEFAULT_MODEL_ID" ] && is_default="true"
    
      # Single entry per model. The previous "(Extended Thinking)" variant
      # was dropped — 16 Bedrock models would have produced 32 dropdown
      # entries, which is too noisy. Users who want extended thinking can
      # toggle `provider_options.bedrock.effort` via the admin UI.
      options='{}'
    
      payload=$(jq -n \
        --arg provider "$PROVIDER_TYPE" \
        --arg model "$model_id" \
        --arg display "$display" \
        --argjson context "$context" \
        --argjson cost "$cost" \
        --argjson is_default "$is_default" \
        --argjson options "$options" '{
          provider: $provider,
          model: $model,
          display_name: $display,
          context_limit: $context,
          enabled: true,
          is_default: $is_default,
          model_config: {
            max_output_tokens: 32000,
            cost: $cost,
            provider_options: $options
          }
        }')
    
      upsert_model_by_name "$display" "$payload"
    done
    
    # ---------------------------------------------------------------------------
    # RHAIIS model — single openai-compat model for tonight (Llama 3.3 70B)
    # ---------------------------------------------------------------------------
    
    RHAIIS_COST='{"input_price_per_million_tokens":0,"output_price_per_million_tokens":0,"cache_read_price_per_million_tokens":0}'
    
    echo ""
    echo "==> Configuring RHAIIS model..."
    RHAIIS_PAYLOAD=$(jq -n \
      --arg model "$RHAIIS_MODEL_ID" \
      --arg display "$RHAIIS_DISPLAY_NAME" \
      --argjson cost "$RHAIIS_COST" '{
        provider: "openai-compat",
        model: $model,
        display_name: $display,
        context_limit: 32768,
        enabled: true,
        is_default: false,
        model_config: {
          max_output_tokens: 4096,
          cost: $cost
        }
      }')
    upsert_model_by_name "$RHAIIS_DISPLAY_NAME" "$RHAIIS_PAYLOAD"
    
    # ---------------------------------------------------------------------------
    # Coder Agents system prompt + plan-mode instructions
    # ---------------------------------------------------------------------------
    #
    # Re-applies the custom system prompt appendix and plan-mode instructions
    # on every Job run. Same files that are committed to the repo at
    # manifests/coder-agents-config/{system-prompt.md,plan-mode-instructions.md}
    # get baked into the configmap and mounted at /etc/coder-agents-prompts/
    # alongside this script. PUTs to /api/experimental/chats/config/* — same
    # endpoints the Coder Console UI uses under
    # https://${CODER_URL}/agents/instructions.
    #
    # Why this is here and not declarative: chatd stores prompt config in
    # its Postgres, NOT in a Kubernetes CR. Doing it via API ensures the
    # state in Postgres matches the text in git on every reconcile.
    
    SYSTEM_PROMPT_FILE="/etc/coder-agents-prompts/system-prompt.md"
    PLAN_MODE_FILE="/etc/coder-agents-prompts/plan-mode-instructions.md"
    
    if [ -f "$SYSTEM_PROMPT_FILE" ]; then
      echo ""
      echo "==> Setting chat system-prompt appendix..."
      jq -n --rawfile prompt "$SYSTEM_PROMPT_FILE" \
            '{system_prompt: $prompt, include_default_system_prompt: true}' \
        | curl -sf -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            --data-binary @- "${BASE}/config/system-prompt" \
            >/dev/null && echo "    OK ($(wc -c <"$SYSTEM_PROMPT_FILE") bytes)" \
                         || echo "    FAILED — check Coder build supports /chats/config/system-prompt"
    fi
    
    if [ -f "$PLAN_MODE_FILE" ]; then
      echo ""
      echo "==> Setting chat plan-mode instructions..."
      jq -n --rawfile prompt "$PLAN_MODE_FILE" \
            '{plan_mode_instructions: $prompt}' \
        | curl -sf -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            --data-binary @- "${BASE}/config/plan-mode-instructions" \
            >/dev/null && echo "    OK ($(wc -c <"$PLAN_MODE_FILE") bytes)" \
                         || echo "    FAILED — check Coder build supports /chats/config/plan-mode-instructions"
    fi
    
    # ---------------------------------------------------------------------------
    # RBAC: custom org role + OIDC group->role sync for Keycloak demo users
    # ---------------------------------------------------------------------------
    #
    # 3-persona model (docs/decisions.md §37):
    #   /admins   (demoadm) -> site role `owner` (via CODER_OIDC_USER_ROLE_MAPPING)
    #   /auditors (bob)     -> site role `auditor` (via CODER_OIDC_USER_ROLE_MAPPING)
    #   /developers (alice) -> NO site role; gets the custom org role
    #                          `developers-chat` (workspace.* + chat.*)
    #                          assigned below via org idpsync/roles PATCH.
    #
    # Why split site + org sync:
    #   - Site-level CODER_OIDC_USER_ROLE_MAPPING only accepts built-in role
    #     names. We use it for `auditor`/`owner`.
    #   - Custom roles are organization-scoped and configured per-org. The
    #     workspace.create + chat.* verbs alice needs (without granting
    #     site-wide audit visibility, which is bob's job) need a custom
    #     org role + per-org OIDC role-sync settings PATCH.
    #
    # License requirement: OIDC role sync needs the Premium
    # `user_role_management` license entitlement. If the cluster's Coder
    # license doesn't include it, the role-sync env vars are silent no-ops
    # and the role creation API returns 402/403. The Job logs will surface
    # either condition; we don't fail the Job — model + prompt config still
    # need to apply.
    
    CODER_API="${CODER_URL%/}/api/v2"
    ROLE_NAME="developers-chat"
    ROLE_DISPLAY="Developer (Workspace + Chat)"
    
    echo ""
    echo "==> Fetching default organization ID..."
    ORG_ID=$(curl -sf -H "$AUTH" "${CODER_API}/organizations/default" 2>/dev/null | jq -r '.id // empty')
    
    if [ -z "$ORG_ID" ]; then
      echo "    SKIP — could not resolve default org (Coder may still be starting)."
    else
      echo "    Default org: $ORG_ID"
    
      # Note: audit_log + connection_log are deliberately OMITTED here.
      # In the 3-persona model, audit visibility belongs to bob (Auditor
      # site role); alice (developer) gets workspace + chat scope only.
      # Template read + group/org metadata stay so alice can browse the
      # workspace picker and see her org context.
      ROLE_PAYLOAD=$(jq -n \
        --arg name "$ROLE_NAME" \
        --arg display "$ROLE_DISPLAY" \
        --arg org "$ORG_ID" \
        '{
          name: $name,
          organization_id: $org,
          display_name: $display,
          site_permissions: [],
          user_permissions: [],
          organization_member_permissions: [],
          organization_permissions: [
            {negate:false,resource_type:"template",action:"read"},
            {negate:false,resource_type:"template",action:"view_insights"},
            {negate:false,resource_type:"group",action:"read"},
            {negate:false,resource_type:"group_member",action:"read"},
            {negate:false,resource_type:"organization",action:"read"},
            {negate:false,resource_type:"organization_member",action:"read"},
            {negate:false,resource_type:"workspace",action:"create"},
            {negate:false,resource_type:"workspace",action:"read"},
            {negate:false,resource_type:"workspace",action:"start"},
            {negate:false,resource_type:"workspace",action:"stop"},
            {negate:false,resource_type:"workspace",action:"application_connect"},
            {negate:false,resource_type:"workspace",action:"ssh"},
            {negate:false,resource_type:"chat",action:"create"},
            {negate:false,resource_type:"chat",action:"read"},
            {negate:false,resource_type:"chat",action:"update"},
            {negate:false,resource_type:"chat",action:"delete"}
          ]
        }')
    
      echo "==> Upserting custom org role '${ROLE_NAME}'..."
      # In Coder 2.33.2 the org-roles endpoints split: POST creates, PUT
      # updates by name. PUT against the collection endpoint (without a
      # role name in the path) returns 404. So:
      #   1. Try POST first — creates a new role.
      #   2. If 409 ("already exists") fall back to PUT /<rolename> to
      #      update in place.
      # An older comment in this script claimed PUT-on-collection was
      # idempotent; that's no longer true (Coder 2.33+).
      ROLE_HTTP=$(echo "$ROLE_PAYLOAD" | curl -s -o /tmp/role-resp.json -w "%{http_code}" \
          -X POST -H "$AUTH" -H "Content-Type: application/json" \
          --data-binary @- "${CODER_API}/organizations/${ORG_ID}/members/roles")
      if [ "$ROLE_HTTP" = "200" ] || [ "$ROLE_HTTP" = "201" ]; then
        echo "    OK (HTTP $ROLE_HTTP — created)"
      elif [ "$ROLE_HTTP" = "409" ]; then
        echo "    Already exists — PUT to update in place..."
        ROLE_HTTP=$(echo "$ROLE_PAYLOAD" | curl -s -o /tmp/role-resp.json -w "%{http_code}" \
            -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            --data-binary @- "${CODER_API}/organizations/${ORG_ID}/members/roles/${ROLE_NAME}")
        if [ "$ROLE_HTTP" = "200" ]; then
          echo "    OK (HTTP $ROLE_HTTP — updated)"
        else
          echo "    UPDATE FAILED (HTTP $ROLE_HTTP): $(cat /tmp/role-resp.json)"
        fi
      elif [ "$ROLE_HTTP" = "402" ] || [ "$ROLE_HTTP" = "403" ]; then
        echo "    SKIP — Coder license lacks FeatureCustomRoles (HTTP $ROLE_HTTP). $(cat /tmp/role-resp.json | jq -r '.message // .detail // empty')"
      else
        echo "    FAILED (HTTP $ROLE_HTTP): $(cat /tmp/role-resp.json)"
      fi
    
      echo "==> Configuring org OIDC role-sync mapping (developers -> ${ROLE_NAME})..."
      SYNC_PAYLOAD=$(jq -n --arg role "$ROLE_NAME" \
        '{field: "groups", mapping: {developers: [$role]}}')
      SYNC_HTTP=$(echo "$SYNC_PAYLOAD" | curl -s -o /tmp/sync-resp.json -w "%{http_code}" \
          -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
          --data-binary @- "${CODER_API}/organizations/${ORG_ID}/settings/idpsync/roles")
      if [ "$SYNC_HTTP" = "200" ]; then
        echo "    OK"
      elif [ "$SYNC_HTTP" = "402" ] || [ "$SYNC_HTTP" = "403" ]; then
        echo "    SKIP — Coder license lacks FeatureUserRoleManagement (HTTP $SYNC_HTTP)."
      else
        echo "    FAILED (HTTP $SYNC_HTTP): $(cat /tmp/sync-resp.json)"
      fi
    fi
    
    # ---------------------------------------------------------------------------
    # Summary
    # ---------------------------------------------------------------------------
    
    echo ""
    echo "Done."
    echo "  Verify: ${CODER_URL%/}/admin/ai-governance"
    echo "  Or via API: curl -H \"$AUTH\" ${BASE}/model-configs | jq '.[] | {provider,model,display_name,enabled,is_default}'"
    echo "  Instructions (UI): ${CODER_URL%/}/agents/instructions"
  system-prompt.md: |
    <!--
    Intentionally empty (2026-05-11). Coder Agents runs on the built-in
    default system prompt (chatd's DefaultSystemPrompt). We previously
    maintained ~8 KiB of override rules here trying to guide Llama 70B INT4
    through edge cases (spawn loops, wait_agent JSON types, sub-agent tool
    palette, etc.); the overrides did not stick — Llama-INT4 follows the
    default's positive instructions ("use AS MANY TOOLS") but ignores
    restrictive overrides. Sonnet/Opus handle the same flows correctly
    without any appendix.
    
    Decision: ship default-only. Booth demo runs on Claude Sonnet 4.6 as the
    chatd default (`coder-agent` label); sovereign Llama is opt-in via
    `coder-agent:llama` with the understanding that its agentic-loop
    behavior is weaker than the Bedrock models.
    
    See docs/decisions.md §34 for the reversal write-up. To re-add targeted
    overrides in the future, edit this file then re-run
    scripts/render-coder-agents-configmap.sh to update the bootstrap Job's
    ConfigMap; the agents-config Job will PUT the new content to
    /api/experimental/chats/config/system-prompt on its next Argo sync.
    -->
