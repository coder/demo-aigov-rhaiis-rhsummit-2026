# Coder — installed via the upstream Helm chart, latest RC for full Coder
# Agents Early Access functionality.
#
# Values are inline below. For the demo we accept a few simplifications vs.
# production:
#   - Postgres connection comes from the `coder-app` Secret that the
#     CloudNativePG operator auto-generates when it reconciles the
#     `Cluster` CR in `manifests/postgres/cluster.yaml` (sync wave 0).
#   - `restricted-v2` SCC defaults are NOT overridden (no STIG/FIPS posture)
#   - Wildcard route is created via the Coder chart's ingress.openshift section
#
# Required Secrets in the `coder` namespace (NOT managed by this app — must
# exist before Coder pods schedule, otherwise they'll CrashLoopBackOff on
# env var lookup):
#
#   1. `coder-app`     — auto-created by CNPG (postgres URL).
#   2. `coder-secrets` — GitHub OAuth client ID/secret for the
#                        `demo-rhsummit-users` org. Keys:
#                            github-client-id
#                            github-client-secret
#                        Managed as a SealedSecret in
#                        manifests/secrets/coder-secrets.yaml; decrypted by
#                        the Bitnami controller (gitops/apps/sealed-secrets).
#                        See docs/secrets.md for the seal/rotate workflow.
#
# NOTES:
#   - The chart version + image tag track Coder release-candidate releases.
#     Bump as new RCs ship. Linear: project `0e26deb1` (Coder Agents) —
#     verify the May Beta milestone before booth.
#   - AWS Bedrock credentials are provided via IRSA. The cluster runs in
#     STS mode with a pod identity webhook. The bootstrap step annotates
#     the `coder` ServiceAccount with the Bedrock IAM role ARN, and the
#     webhook injects AWS_ROLE_ARN + token into the pod automatically.
#     AI Bridge picks up Bedrock via the same SDK path — no static keys.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.coder.com/v2
    chart: coder
    targetRevision: 2.33.0-rc.3       # latest tagged RC (commit 3362b5ae, Apr 22 2026)
    helm:
      releaseName: coder
      values: |
        coder:
          image:
            repo: ghcr.io/coder/coder
            tag: v2.33.0-rc.3          # match chart targetRevision
            pullPolicy: IfNotPresent

          # Prometheus scrape annotations on every pod
          podAnnotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "2112"

          env:
            # ── Core URLs ───────────────────────────────────────────────
            - name: CODER_ACCESS_URL
              value: "https://coder.apps.cluster.rhsummit.coderdemo.io"   # update to your cluster_fqdn
            - name: CODER_WILDCARD_ACCESS_URL
              value: "*.coder.apps.cluster.rhsummit.coderdemo.io"
            # Coder writes its build cache here. The chart mounts an
            # emptyDir at /tmp (see volumes/volumeMounts below) so the
            # restricted-v2 SCC's readOnlyRootFilesystem stays satisfied.
            - name: CODER_CACHE_DIRECTORY
              value: /tmp/coder

            # ── Postgres (CNPG-generated) ───────────────────────────────
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-app          # auto-generated by CNPG operator
                  key: uri

            # ── Security headers + cookie hardening ─────────────────────
            - name: CODER_DISABLE_PATH_APPS
              value: "true"
            - name: CODER_SECURE_AUTH_COOKIE
              value: "true"
            - name: CODER_STRICT_TRANSPORT_SECURITY
              value: "31536000"

            # ── Token lifetimes ─────────────────────────────────────────
            # The "admin" cap (CODER_MAX_ADMIN_TOKEN_LIFETIME) defaults
            # to 168h (7d) and applies to Owner/Admin users — too short
            # for the GH Actions template-push token, which is created
            # by an Owner (ausbru87). The non-admin cap
            # (CODER_MAX_TOKEN_LIFETIME) already defaults to 876600h
            # (100y), so we only need to raise the admin one.
            #
            # 1y bound. Token lives in GH Actions secrets, scoped to
            # template push, and rotated when the Coder version bumps
            # or the SA-equivalent pattern changes.
            - name: CODER_MAX_ADMIN_TOKEN_LIFETIME
              value: "8760h"

            # ── Auth: GitHub OAuth for `demo-rhsummit-users` org ────────
            # Password auth disabled — GitHub is the only login method.
            - name: CODER_DISABLE_PASSWORD_AUTH
              value: "true"
            - name: CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS
              value: "true"
            - name: CODER_OAUTH2_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: github-client-id
            - name: CODER_OAUTH2_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: github-client-secret
            - name: CODER_OAUTH2_GITHUB_ALLOWED_ORGS
              value: "demo-rhsummit-users"

            # ── External git auth (GitHub) for workspace clone/push ─────
            # Reuses the same OAuth app as login.
            - name: CODER_EXTERNAL_AUTH_0_TYPE
              value: "github"
            - name: CODER_EXTERNAL_AUTH_0_ID
              value: "github"
            - name: CODER_EXTERNAL_AUTH_0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: github-client-id
            - name: CODER_EXTERNAL_AUTH_0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: github-client-secret

            # ── External provisioner mode ───────────────────────────────
            # Disable in-process provisioners; the coder-provisioner
            # Deployment (gitops/apps/coder-provisioner/) handles all
            # template builds.
            - name: CODER_PROVISIONER_DAEMONS
              value: "0"

            # ── AI Bridge ───────────────────────────────────────────────
            # Bedrock-only via IRSA — the pod identity webhook injects
            # AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE from the `coder`
            # ServiceAccount annotation. AI Bridge picks Bedrock up
            # through the standard AWS SDK credential chain. No static
            # OpenAI/Anthropic/Gemini keys.
            - name: CODER_AIBRIDGE_ENABLED
              value: "true"
            - name: CODER_AIBRIDGE_STRUCTURED_LOGGING
              value: "true"
            - name: CODER_AIBRIDGE_RETENTION
              value: "30d"
            - name: AWS_REGION
              value: "us-east-1"

            # ── Coder Agents Early Access ───────────────────────────────
            - name: CODER_EXPERIMENTS
              value: "agents"

            # ── Telemetry / direct-connect off for demo network ─────────
            - name: CODER_DISABLE_DIRECT_CONNECTIONS
              value: "true"
            - name: CODER_DISABLE_NETWORK_TELEMETRY
              value: "true"
            - name: CODER_DISABLE_USAGE_STATS
              value: "true"

            # ── Prometheus ──────────────────────────────────────────────
            - name: CODER_PROMETHEUS_ENABLE
              value: "true"
            - name: CODER_PROMETHEUS_ADDRESS
              value: "0.0.0.0:2112"
            - name: CODER_PROMETHEUS_COLLECT_AGENT_STATS
              value: "true"

          replicaCount: 3     # multi-AZ HA — one pod per AZ via topology spread below

          # Use OpenShift Routes via the chart's built-in support
          ingress:
            enable: false      # We'll create OpenShift Route separately if needed

          serviceAccount:
            name: coder-server
            workspacePerms: true
            enableDeployments: true
            annotations:
              eks.amazonaws.com/role-arn: "arn:aws:iam::342934376218:role/demo/cluster-coder-bedrock"

          # OpenShift restricted-v2 SCC compliance (per docs.coder.com/install/openshift)
          securityContext:
            runAsNonRoot: true
            runAsUser: null
            runAsGroup: null
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault

          volumes:
            - name: cache
              emptyDir:
                sizeLimit: 1Gi

          volumeMounts:
            - name: cache
              mountPath: /tmp
              readOnly: false

          service:
            type: ClusterIP

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # Spread the 3 Coder pods across the 3 OCP node AZs so a single AZ
          # outage takes at most one replica. Aurora Postgres failover (writer
          # endpoint repoint) is automatic and survives the same AZ event.
          # Converged-cluster scheduling: masters are made schedulable via
          # Scheduler/cluster.spec.mastersSchedulable=true (owned by
          # gitops/apps/cluster-config/), so no master toleration is needed.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: coder

          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: coder
                    topologyKey: kubernetes.io/hostname

  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
